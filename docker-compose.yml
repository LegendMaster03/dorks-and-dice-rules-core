# Phase 3A review-only deployment definition. Do not run without approval.
services:
  rules-core-public:
    image: ${RULES_CORE_IMAGE:?RULES_CORE_IMAGE must identify the reviewed release}
    build: .
    container_name: dorks-and-dice-rules-core
    restart: unless-stopped
    environment:
      RulesCore__ApiSurface: PublicOnly
      Rulesets__ContentRoot: /app/data/rulesets
    networks:
      - dorks-and-dice-backend

networks:
  dorks-and-dice-backend:
    external: true
