name: One-time SRD structured baseline copy

# Trigger only when this temporary bootstrap workflow is first added.
# No imports run as part of normal development builds.
on:
  push:
    branches:
      - feature/rules-core-rewrite
    paths:
      - .github/workflows/bootstrap-srd-baseline.yml

permissions:
  contents: write

concurrency:
  group: rules-core-srd-baseline
  cancel-in-progress: false

jobs:
  copy-srd-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rewrite branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Copy pinned SRD-only structured JSON
        env:
          SRD_REPO: https://github.com/CoolFireGiant/hewnhero-srd.git
          SRD_COMMIT: d06d1dadee357857767b1e4da985df6609509bcf
        run: |
          set -euo pipefail
          mkdir -p /tmp/srd-baseline
          git clone --quiet --no-checkout --filter=blob:none "$SRD_REPO" /tmp/srd-baseline
          git -C /tmp/srd-baseline checkout --quiet "$SRD_COMMIT"
          actual="$(git -C /tmp/srd-baseline rev-parse HEAD)"
          test "$actual" = "$SRD_COMMIT"

          mkdir -p data/reference/srd/structured
          test ! -e data/reference/srd/structured/book
          cp -a /tmp/srd-baseline/data/. data/reference/srd/structured/

          python3 - <<'PY'
          import hashlib, json, pathlib
          source = pathlib.Path("data/reference/srd/structured")
          paths = sorted(source.rglob("*.json"))
          assert len(paths) >= 80, f"Unexpectedly small SRD-only pack: {len(paths)} JSON files"
          mandatory = [
              "book/book-srd51.json", "book/book-srd52.json",
              "skills.json", "races.json", "actions.json",
              "conditionsdiseases.json", "items.json",
              "spells/spells-srd51.json", "spells/spells-srd52.json",
              "bestiary/bestiary-srd51.json", "bestiary/bestiary-srd52.json",
              "class/class-wizard.json",
          ]
          for name in mandatory:
              assert (source / name).is_file(), f"Missing essential SRD component: {name}"
          entries = []
          for p in paths:
              data = p.read_bytes()
              json.loads(data)
              entries.append({
                  "path": str(p.relative_to(source)),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "bytes": len(data),
              })
          summary = {
              "status": "complete-copy-of-pinned-structured-srd-data-pack; not-verified-against-official-pdfs",
              "provider": "CoolFireGiant/hewnhero-srd",
              "repository": "https://github.com/CoolFireGiant/hewnhero-srd",
              "commit": "d06d1dadee357857767b1e4da985df6609509bcf",
              "license": "CC BY 4.0 (upstream pack claim; verify individual records against official SRDs)",
              "originalSourceVersions": ["SRD 5.1", "SRD 5.2.1"],
              "files": entries,
              "totalBytes": sum(e["bytes"] for e in entries),
              "structuredCount": len(entries),
              "nativeDataReconciled": False,
          }
          dest = pathlib.Path("data/reference/srd/structured-manifest.json")
          dest.write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          print("Imported", len(entries), "JSON files;", summary["totalBytes"], "bytes")
          PY

      - name: Commit copied complete structured SRD data
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/rules-core-rewrite"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/reference/srd/structured data/reference/srd/structured-manifest.json
          if git diff --cached --quiet; then
            echo "SRD pack already copied; nothing to commit."
          else
            git -c commit.gpgsign=false commit -m "data(rewrite): copy complete pinned SRD 5.1 and 5.2.1 structured source pack"
            git push origin HEAD:feature/rules-core-rewrite
          fi
