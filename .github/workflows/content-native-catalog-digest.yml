# On-demand loader fingerprint/inventory diagnostic.
# Main integration CI and the deployment preflight already run loader checks.
# Draft content need not pass this job on each pull request.
name: Rules Content Native Catalog Digest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-digest:
    name: Calculate exact loader fingerprint and review inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Check content against ledger with the actual C# native loader
        env:
          CONTENT_REVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: dotnet run --project tests/NativeCatalogFingerprint/NativeCatalogFingerprint.csproj --configuration Release
