name: Final Monster Feature Restoration
on:
  push:
    branches: [feature/rules-core-baseline-consistency]
    paths:
      - tools/finalize_monster_removed_features.py
      - tests/test_final_monster_removed_features.py
      - .github/workflows/final-monster-features.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final compatible creature feature mapping
        run: python3 tools/finalize_monster_removed_features.py
      - name: Validate entire native rules inventory
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Audit native identities
        run: python3 tools/audit_native_baseline.py
      - name: Commit reconciled feature data to review branch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/native data/reference/srd/monster-legacy-variant-review.json docs/rewrite/native-reconciliation-statistics.json docs/rewrite/monster-legacy-feature-results.json
          git commit -m "data(rewrite): finish common legacy monster feature restoration"
          git push origin HEAD:feature/rules-core-baseline-consistency
