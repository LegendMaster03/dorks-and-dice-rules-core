name: Finalize Source Pagination

on:
  push:
    branches: [ "fix/source-library-pagination" ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/source-library-pagination
      - name: Finalize changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Remove duplicate page-size declarations regardless of how many race-insertions occurred.
          path = Path('src/RulesCore.Web/wwwroot/source-library.js')
          text = path.read_text()
          text = re.sub(
              r'(const SOURCE_PAGE_SIZE = 100;\n)(?:const SOURCE_PAGE_SIZE = 100;\n)+',
              r'\1',
              text,
              count=1)
          if text.count('const SOURCE_PAGE_SIZE = 100;') != 1:
              raise SystemExit('Unexpected SOURCE_PAGE_SIZE declaration count')
          path.write_text(text)

          # Keep exactly one auto-resolution notice block using brace-aware line removal.
          path = Path('src/RulesCore.Web/wwwroot/source-versioning.js')
          lines = path.read_text().splitlines(keepends=True)
          marker = 'if (model.latestDecision?.note?.startsWith("Auto-resolved:")) {'
          output = []
          seen = 0
          i = 0
          while i < len(lines):
              if lines[i].strip() == marker:
                  seen += 1
                  if seen > 1:
                      depth = 0
                      while i < len(lines):
                          depth += lines[i].count('{') - lines[i].count('}')
                          i += 1
                          if depth == 0:
                              break
                      continue
              output.append(lines[i])
              i += 1
          text = ''.join(output)
          if seen < 1 or text.count('Automatically resolved: the bound editions have the same rule-bearing content.') != 1:
              raise SystemExit('Unexpected auto-resolution alert count')
          path.write_text(text)

          # Make direct global source binding participate in the same conservative resolver.
          path = Path('src/RulesCore.Infrastructure/Rules/GlobalRulesService.cs')
          text = path.read_text()
          method_start = text.index('    public async Task<RuleMutationResult<RuleConceptSourceBindingView>> BindSourceEntityAsync(')
          method_end = text.index('    public async Task<RuleMutationResult<GlobalRuleDecisionView>> SetDecisionAsync(', method_start)
          method = text[method_start:method_end]

          existing_old = '''        if (existing is not null)\n        {\n            return new RuleMutationResult<RuleConceptSourceBindingView>(\n'''
          existing_new = '''        if (existing is not null)\n        {\n            await RuleAutoResolutionService.TryResolveAsync(\n                dbContext,\n                ruleConceptId,\n                actor,\n                cancellationToken);\n            return new RuleMutationResult<RuleConceptSourceBindingView>(\n'''
          if existing_old in method:
              method = method.replace(existing_old, existing_new, 1)
          elif 'await RuleAutoResolutionService.TryResolveAsync(' not in method:
              raise SystemExit('Existing-binding auto-resolution insertion point not found')

          save_old = '''        dbContext.RuleConceptSourceBindings.Add(binding);\n        await dbContext.SaveChangesAsync(cancellationToken);\n\n        return new RuleMutationResult<RuleConceptSourceBindingView>(\n'''
          save_new = '''        dbContext.RuleConceptSourceBindings.Add(binding);\n        await dbContext.SaveChangesAsync(cancellationToken);\n        await RuleAutoResolutionService.TryResolveAsync(\n            dbContext,\n            ruleConceptId,\n            actor,\n            cancellationToken);\n\n        return new RuleMutationResult<RuleConceptSourceBindingView>(\n'''
          if save_old in method:
              method = method.replace(save_old, save_new, 1)
          elif method.count('await RuleAutoResolutionService.TryResolveAsync(') < 2:
              raise SystemExit('New-binding auto-resolution insertion point not found')

          text = text[:method_start] + method + text[method_end:]
          path.write_text(text)

          # Direct binding now creates the initial automatic decision; the explicit helper call is only the idempotence check.
          path = Path('tests/RulesCore.IntegrationTests/SourcePagingAndAutoResolutionIntegrationTests.cs')
          text = path.read_text()
          start_marker = '''            var unchangedResolution = await RuleAutoResolutionService.TryResolveAsync(\n'''
          end_marker = '''            var unchangedDecision = await db.GlobalRuleDecisions\n'''
          if start_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              text = text[:start] + text[end:]
          text = text.replace(
              'Assert.Equal(RuleDecisionKinds.SelectSource, unchangedDecision.DecisionKind);',
              'Assert.Equal("select-source", unchangedDecision.DecisionKind);',
              1)
          if 'var unchangedResolution =' in text or 'RuleDecisionKinds.SelectSource' in text:
              raise SystemExit('Auto-resolution test cleanup did not complete')
          path.write_text(text)
          PY

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/RulesCore.Web/wwwroot/source-library.js \
            src/RulesCore.Web/wwwroot/source-versioning.js \
            src/RulesCore.Infrastructure/Rules/GlobalRulesService.cs \
            tests/RulesCore.IntegrationTests/SourcePagingAndAutoResolutionIntegrationTests.cs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize source paging and unchanged-rule resolution"
          git push origin HEAD:fix/source-library-pagination
