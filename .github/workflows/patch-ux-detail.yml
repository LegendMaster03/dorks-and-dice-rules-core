name: Patch Rules Core UX Detail

on:
  push:
    branches: [ "ux/rules-core-redesign" ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/rules-core-redesign

      - name: Apply UX detail changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  if new in text:
                      return text
                  raise SystemExit(f"Missing replacement target: {label}")
              return text.replace(old, new, 1)

          path = Path('src/RulesCore.Web/wwwroot/source-normalization.js')
          text = path.read_text()
          text = replace_once(text,
              '''        const card = createNormalizationCard(app, container);\n        const insertionPoint = container.children[2] ?? null;\n        container.insertBefore(card, insertionPoint);\n        await card.loadCandidates();\n''',
              '''        const card = createNormalizationCard(app, container);\n        const insertionPoint = container.children[2] ?? null;\n        container.insertBefore(card, insertionPoint);\n''',
              'stop eager normalization loading')
          text = replace_once(text,
              '''                text: "Review deterministic concept suggestions for accessible source entities that are not bound yet. Suggestions never apply automatically."\n''',
              '''                text: "Review deterministic concept suggestions for accessible source entities that are not bound yet. Binding remains deliberate; mechanically identical cross-edition rules may then resolve automatically."\n''',
              'normalization heading copy')
          text = replace_once(text,
              '''        text: "The suggested key is derived only from entity type and name. Accepting a suggestion creates or reuses that stable concept and binds this source entity; it does not create a rule decision or publish anything."\n''',
              '''        text: "The suggested key is derived only from entity type and name. Accepting creates or reuses that stable concept and binds this source. If that completes a mechanically identical cross-edition set, Rules Core may record an automatic no-change decision; publication remains explicit."\n''',
              'normalization help copy')
          text = replace_once(text,
              '''    const status = element("div");\n    const results = element("div");\n    card.append(status, results);\n\n    let page = 0;\n''',
              '''    const status = element("div");\n    const results = element("div");\n    results.append(element("div", {\n        className: "rules-core-idle-state",\n        text: "Search by rule name, source, edition, or entity type when you are ready to review normalization suggestions."\n    }));\n    card.append(status, results);\n\n    let page = 0;\n''',
              'normalization idle state')
          path.write_text(text)

          path = Path('src/RulesCore.Web/wwwroot/source-library.js')
          text = path.read_text()
          text = replace_once(text,
              '''                element("div", { className: "text-body-secondary small", text: "Source material stays separate until you explicitly bind, decide, and publish." })),\n''',
              '''                element("div", { className: "text-body-secondary small", text: "Source material stays separate until you deliberately bind it. Unchanged editions may resolve automatically; publication remains explicit." })),\n''',
              'workflow auto-resolution copy')
          path.write_text(text)

          path = Path('src/RulesCore.Web/wwwroot/rules-core.css')
          text = path.read_text()
          addition = r'''

.rules-core-generated-page-lead {
    margin-bottom: 1.1rem;
    padding: .1rem 0 .25rem;
}

.rules-core-generated-page-lead h2 {
    margin: 0 0 .3rem;
    font-size: clamp(1.45rem, 1.8vw, 1.85rem);
    font-weight: 760;
    letter-spacing: -.025em;
}

.rules-core-generated-page-lead p {
    max-width: 60rem;
    margin: 0;
    font-size: .93rem;
    line-height: 1.5;
}

.rules-core-tool-disclosure {
    margin-bottom: .8rem;
    border: 1px solid var(--rules-core-border);
    border-radius: .78rem;
    background: var(--rules-core-surface);
    overflow: clip;
}

.rules-core-tool-disclosure > summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: .8rem .9rem;
    list-style: none;
    user-select: none;
}

.rules-core-tool-disclosure > summary::-webkit-details-marker {
    display: none;
}

.rules-core-tool-disclosure > summary:hover {
    background: var(--rules-core-surface-subtle);
}

.rules-core-tool-disclosure > summary strong,
.rules-core-tool-disclosure > summary small {
    display: block;
}

.rules-core-tool-disclosure > summary strong {
    font-size: .86rem;
}

.rules-core-tool-disclosure > summary small {
    margin-top: .08rem;
    color: var(--bs-secondary-color);
    font-size: .72rem;
}

.rules-core-disclosure-cue {
    flex: 0 0 auto;
    color: var(--bs-primary);
    font-size: .72rem;
    font-weight: 700;
}

.rules-core-tool-disclosure > .card {
    margin: 0 !important;
    border: 0 !important;
    border-top: 1px solid var(--rules-core-border) !important;
    border-radius: 0 !important;
    box-shadow: none !important;
}

.rules-core-idle-state {
    padding: .8rem .9rem;
    border: 1px dashed var(--rules-core-border);
    border-radius: .68rem;
    background: var(--rules-core-surface-subtle);
    color: var(--bs-secondary-color);
    font-size: .82rem;
    line-height: 1.45;
}
'''
          if '.rules-core-generated-page-lead {' not in text:
              text += addition
          path.write_text(text)
          PY

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/RulesCore.Web/wwwroot/source-normalization.js src/RulesCore.Web/wwwroot/source-library.js src/RulesCore.Web/wwwroot/rules-core.css
          git commit -m "Reduce Rules Lawyer setup clutter"
          git push origin HEAD:ux/rules-core-redesign