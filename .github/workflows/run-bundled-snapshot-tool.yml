name: Run Bundled SRD Snapshot Tool

on:
  push:
    branches: [ "fix/bundle-canonical-srds" ]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Generate snapshots
        run: dotnet run --project tools/RulesCore.SourceSnapshotGenerator/RulesCore.SourceSnapshotGenerator.csproj --configuration Release -- src/RulesCore.Infrastructure/BundledSources
      - name: Commit snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/RulesCore.Infrastructure/BundledSources
          if git diff --cached --quiet; then
            echo "No snapshot changes."
            exit 0
          fi
          git commit -m "Bundle reviewed canonical SRD snapshots"
          git push origin HEAD:fix/bundle-canonical-srds
