name: Apply Library Pagination UI

on:
  push:
    branches: [ "fix/source-library-pagination" ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/source-library-pagination
      - name: Apply browser changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/RulesCore.Web/wwwroot/source-library.js')
          text = path.read_text()
          text = text.replace(
              'const SOURCE_LIMIT = 200;\n',
              'const SOURCE_LIMIT = 200;\nconst SOURCE_PAGE_SIZE = 100;\n',
              1)
          text = text.replace(
              'app.libraryFilters = { entityType: "", query: "" };',
              'app.libraryFilters = { entityType: "", query: "", page: 0 };',
              1)
          text = text.replace(
              'app.libraryFilters = { entityType: "", query: state.sourceCode };',
              'app.libraryFilters = { entityType: "", query: state.sourceCode, page: 0 };')
          text = text.replace(
              'app.libraryFilters = { entityType: "monster", query: state.sourceCode };',
              'app.libraryFilters = { entityType: "monster", query: state.sourceCode, page: 0 };')
          text = text.replace(
              'app.libraryFilters = { entityType: type.value, query: query.value.trim() };',
              'app.libraryFilters = { entityType: type.value, query: query.value.trim(), page: 0 };')
          text = text.replace(
              'app.libraryFilters = { entityType: "monster", query: query.value.trim() };',
              'app.libraryFilters = { entityType: "monster", query: query.value.trim(), page: 0 };')

          start = text.index('async function renderBrowserResults(app, container) {')
          end = text.index('\nasync function renderSourceEntityDetail(app, container, entityId) {', start)
          replacement = r'''async function renderBrowserResults(app, container) {
              clear(container);
              container.append(element("div", { className: "text-body-secondary", text: "Loading source entities…" }));
              try {
                  const page = Math.max(0, app.libraryFilters.page ?? 0);
                  const offset = page * SOURCE_PAGE_SIZE;
                  const requested = await app.api.searchSourceEntityPage({
                      entityType: app.libraryFilters.entityType || null,
                      query: app.libraryFilters.query || null,
                      limit: SOURCE_PAGE_SIZE + 1,
                      offset
                  });
                  const hasNext = requested.length > SOURCE_PAGE_SIZE;
                  const entities = requested.slice(0, SOURCE_PAGE_SIZE);

                  if (!entities.length && page > 0) {
                      app.libraryFilters.page = page - 1;
                      await renderBrowserResults(app, container);
                      return;
                  }

                  clear(container);
                  if (!entities.length) {
                      container.append(alertNode(
                          "secondary",
                          app.libraryFilters.entityType === "monster"
                              ? "No monster entities match these filters."
                              : "No source entities match these filters."));
                      return;
                  }

                  const table = element("table", { className: "table table-hover align-middle mb-0" });
                  const head = element("thead", {}, element("tr", {},
                      element("th", { text: "Source entity" }),
                      element("th", { text: "Type" }),
                      element("th", { text: "Publication" }),
                      element("th", { text: "Revision" }),
                      element("th")));
                  const body = element("tbody");
                  for (const entity of entities) {
                      const open = element("button", {
                          type: "button",
                          className: "btn btn-sm btn-outline-primary",
                          text: entity.entityType === "monster" ? "Inspect stats" : "Open"
                      });
                      open.addEventListener("click", async () => renderSourceEntityDetail(app, container, entity.entityId));
                      body.append(element("tr", {},
                          element("td", {},
                              element("div", { className: "fw-semibold", text: entity.name }),
                              element("div", { className: "small text-body-secondary", text: entity.sourceCode })),
                          element("td", {}, entity.entityType === "monster"
                              ? badge("monster", "primary")
                              : badge(entity.entityType, "secondary")),
                          element("td", {},
                              element("div", { text: entity.editionDisplayName }),
                              element("div", { className: "small text-body-secondary", text: entity.workDisplayName })),
                          element("td", { text: `#${entity.latestRevisionNumber}` }),
                          element("td", { className: "text-end" }, open)));
                  }
                  table.append(head, body);

                  const previous = element("button", {
                      type: "button",
                      className: "btn btn-sm btn-outline-secondary",
                      text: "← Previous"
                  });
                  previous.disabled = page === 0;
                  previous.addEventListener("click", async () => {
                      app.libraryFilters.page = Math.max(0, page - 1);
                      await renderBrowserResults(app, container);
                      document.getElementById("rules-core-source-browser")?.scrollIntoView({ behavior: "smooth", block: "start" });
                  });

                  const next = element("button", {
                      type: "button",
                      className: "btn btn-sm btn-outline-secondary",
                      text: "Next →"
                  });
                  next.disabled = !hasNext;
                  next.addEventListener("click", async () => {
                      app.libraryFilters.page = page + 1;
                      await renderBrowserResults(app, container);
                      document.getElementById("rules-core-source-browser")?.scrollIntoView({ behavior: "smooth", block: "start" });
                  });

                  const firstResult = offset + 1;
                  const lastResult = offset + entities.length;
                  const navigation = element("div", {
                      className: "d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3"
                  },
                      element("div", {
                          className: "small text-body-secondary",
                          text: `Showing ${firstResult}–${lastResult} · Page ${page + 1}`
                      }),
                      element("div", { className: "d-flex gap-2" }, previous, next));

                  container.append(
                      element("div", {
                          className: "small text-body-secondary mb-2",
                          text: `Showing ${firstResult}–${lastResult}${hasNext ? "+" : ""} matching result(s)`
                      }),
                      element("div", { className: "table-responsive" }, table),
                      navigation);
              } catch (error) {
                  clear(container);
                  container.append(alertNode("danger", describeError(error)));
              }
          }
          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)

          path = Path('src/RulesCore.Web/wwwroot/source-versioning.js')
          text = path.read_text()
          needle = '''    if (model.restrictedBindingCount > 0) {
                  card.append(alertNode("warning", `${model.restrictedBindingCount} bound source implementation(s) are hidden because this account lacks source access.`));
              }
          '''
          replacement = '''    if (model.latestDecision?.note?.startsWith("Auto-resolved:")) {
                  card.append(alertNode(
                      "success",
                      "Automatically resolved: the bound editions have the same rule-bearing content. Publication remains a separate action."));
              }
              if (model.restrictedBindingCount > 0) {
                  card.append(alertNode("warning", `${model.restrictedBindingCount} bound source implementation(s) are hidden because this account lacks source access.`));
              }
          '''
          if needle not in text:
              raise SystemExit('source-versioning auto-resolution insertion point not found')
          text = text.replace(needle, replacement, 1)
          path.write_text(text)
          PY

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/RulesCore.Web/wwwroot/source-library.js src/RulesCore.Web/wwwroot/source-versioning.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add source library page navigation"
          git push origin HEAD:fix/source-library-pagination
