name: Retry Rules Core headless split

on:
  push:
    branches: [ "feature/rules-wiki-split" ]
    paths: [ ".github/workflows/migrate-headless-rules-core-retry.yml" ]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rules-wiki-split
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Reuse the validated conversion script
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/migrate-headless-rules-core.yml').read_text().splitlines()
          start = source.index('      - name: Convert Rules Core to a headless service')
          end = source.index('      - name: Validate headless Rules Core')
          run_line = next(i for i in range(start, end) if source[i] == '        run: |')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[run_line + 1:end]) + '\n'
          Path('/tmp/convert-rules-core.sh').write_text(script)
          PY
          bash /tmp/convert-rules-core.sh

          # The original conversion also updates the permanent validation workflow.
          # Keep that change out of the Actions-token commit; the repository connector
          # will update validate.yml separately after this commit lands.
          git checkout -- .github/workflows/validate.yml

      - name: Validate headless Rules Core
        shell: bash
        run: |
          set -euo pipefail
          test ! -d src/RulesCore.Web/wwwroot
          ! grep -R 'module = "/app.js"' -n src/RulesCore.Web
          ! grep -R 'public const string ToolSlug = "rules-core"' -n src
          dotnet restore dorks-and-dice-rules-core.slnx
          dotnet test tests/RulesCore.Tests/RulesCore.Tests.csproj --configuration Release --no-restore
          dotnet build src/RulesCore.Web/RulesCore.Web.csproj --configuration Release --no-restore
          docker build -t dorks-and-dice-rules-core:split -f src/RulesCore.Web/Dockerfile .

      - name: Commit headless split
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/migrate-headless-rules-core.yml
          rm .github/workflows/migrate-headless-rules-core-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Split Rules Wiki presentation from Rules Core"
          git push origin HEAD:feature/rules-wiki-split
