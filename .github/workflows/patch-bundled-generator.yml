name: Patch Bundled SRD Generator

on:
  push:
    branches: [ "fix/bundle-canonical-srds" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add pantheon to deity identity and remove patch workflow
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/generate-bundled-srds.yml')
          text = path.read_text()
          needle = '"classFeature" => JoinIdentity('
          replacement = '"deity" => JoinIdentity(item, "pantheon"),\n                  "classFeature" => JoinIdentity('
          if needle not in text:
              raise SystemExit('generator classFeature identity case was not found')
          path.write_text(text.replace(needle, replacement, 1))
          Path('.github/workflows/patch-bundled-generator.yml').unlink()
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/generate-bundled-srds.yml .github/workflows/patch-bundled-generator.yml
          git commit -m "Disambiguate bundled SRD deities by pantheon"
          git push origin HEAD:fix/bundle-canonical-srds
