name: One-time SRD comparison inventory

on:
  push:
    branches:
      - feature/rules-core-rewrite
    paths:
      - .github/workflows/audit-srd-baseline.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify pinned data pack and inventory source differences
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections
          import hashlib
          import json
          from pathlib import Path

          base=Path("data/reference/srd/structured")
          manifest=json.loads(Path("data/reference/srd/structured-manifest.json").read_text())
          for f in manifest["files"]:
              raw=(base/f["path"]).read_bytes()
              assert len(raw)==f["bytes"], f["path"]
              assert hashlib.sha256(raw).hexdigest()==f["sha256"], f["path"]
              json.loads(raw)

          items=collections.defaultdict(lambda:collections.defaultdict(list))
          category_counts=collections.defaultdict(lambda:collections.Counter())
          no_source=collections.Counter()
          for rel in sorted(base.rglob("*.json")):
              if "book" in rel.parts or "generated" in rel.parts:
                  continue
              if "foundry" in str(rel.relative_to(base)):
                  continue
              try:
                  data=json.loads(rel.read_text())
              except Exception as e:
                  raise RuntimeError(f"Invalid JSON: {rel}") from e
              if not isinstance(data,dict):continue
              for kind,records in data.items():
                  if not isinstance(records,list):continue
                  for rec in records:
                      if not isinstance(rec,dict): continue
                      source=rec.get("source")
                      if source not in {"SRD51","SRD52"}:
                          no_source[kind]+=1
                          continue
                      edition="5.1" if source=="SRD51" else "5.2.1"
                      category_counts[kind][edition]+=1
                      name=rec.get("name") or rec.get("id") or rec.get("caption")
                      if name is None:
                          name=f"unnamed:{rel.relative_to(base)}:{category_counts[kind][edition]}"
                      ident=(kind,str(name).casefold(),str(rec.get("className","")).casefold(),str(rec.get("subclassName","")).casefold(),str(rec.get("parent","")).casefold())
                      items[ident][edition].append({"record":rec,"file":str(rel.relative_to(base))})

          cosmetic={"source","page","otherSources","reprintedAs","srd","srd52","basicRules","basicRules2024","edition","hasFluff","hasFluffImages"}
          def clean(data):
              if isinstance(data,list):return [clean(x) for x in data]
              if isinstance(data,dict):return {k:clean(v) for k,v in sorted(data.items()) if k not in cosmetic}
              return data
          classifications=collections.defaultdict(lambda:collections.Counter())
          conflicts=collections.defaultdict(list)
          counts={cat:dict(counter) for cat,counter in sorted(category_counts.items())}
          for (kind,name,parent,subparent,other),versions in sorted(items.items()):
              a=versions.get("5.1",[])
              b=versions.get("5.2.1",[])
              label={"category":kind,"name":name,"parent":parent or None,"subclass":subparent or None}
              if len(a)>1 or len(b)>1:
                  state="ambiguous-duplicate"
              elif not a:
                  state="only-5.2.1"
              elif not b:
                  state="only-5.1"
              elif clean(a[0]["record"])==clean(b[0]["record"]):
                  state="same-after-cosmetic-normalization"
              else:
                  state="different-content"
              classifications[kind][state]+=1
              if state!="same-after-cosmetic-normalization":
                  conflicts[kind].append({**label,"state":state,
                   "files5_1":[x["file"] for x in a],
                   "files5_2_1":[x["file"] for x in b]})

          chapters={}
          for version,book in [("5.1","book/book-srd51.json"),("5.2.1","book/book-srd52.json")]:
              chapters[version]=[x.get("name","(untitled)") for x in json.loads((base/book).read_text())["data"] if isinstance(x,dict)]
          output={
            "status":"source-comparison-only; no-native-merge-adjudications",
            "sourcePackCommit":manifest["commit"],
            "integrityCheck":"all-manifest-files-SHA256-match",
            "officialSrdPdfParity":"not-independently-verified",
            "topLevelEntitiesByCategory":counts,
            "reconciliationClassesByCategory":{k:dict(v) for k,v in sorted(classifications.items())},
            "unmatchedOrChanged":{k:v for k,v in sorted(conflicts.items())},
            "bookChapters":chapters,
            "nonSrdCodeRecordsExcluded":dict(no_source),
            "comparisonNotes":[
              "Source-only cross-edition comparison; no engine behavior selected.",
              "Names and parent references may still be insufficient to prove identity.",
              "Cosmetic normalization strips edition, page, citation and basic-rules flags only.",
              "Content differences need Dorks & Dice rules or explicit Owner review.",
              "Book narratives are preserved intact in both source documents but not semantically merged."
            ]
          }
          path=Path("data/reference/srd/reconciliation-inventory.json")
          path.write_text(json.dumps(output,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print("Integrity: all",len(manifest["files"]),"files match")
          print("Entity classifications by category")
          for kind,c in sorted(classifications.items()):
              print(kind,dict(c))
          print("Book chapters", {k:len(v) for k,v in chapters.items()})
          PY

      - name: Commit comparison inventory
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/rules-core-rewrite"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/reference/srd/reconciliation-inventory.json
          if ! git diff --cached --quiet; then
            git -c commit.gpgsign=false commit -m "data(rewrite): inventory edition differences in complete SRD corpus"
            git push origin HEAD:feature/rules-core-rewrite
          fi
