name: Finish Monster Legacy Reconciliation
on:
  push:
    branches: [feature/rules-core-baseline-consistency]
    paths:
      - tools/finish_monster_legacy_review.py
      - tests/test_monster_legacy_spells_and_actions.py
      - .github/workflows/finish-monster-legacy.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile removed monster utility and spells
        run: python3 tools/finish_monster_legacy_review.py
      - name: Run full native validation suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run identity consistency audit
        run: python3 tools/audit_native_baseline.py
      - name: Commit generated monster baseline changes
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/native data/reference/srd/monster-legacy-variant-review.json docs/rewrite/native-reconciliation-statistics.json docs/rewrite/monster-legacy-feature-results.json
          git commit -m "data(rewrite): restore removed monster spells and unique utility actions"
          git push origin HEAD:feature/rules-core-baseline-consistency
# One-time final application following reconciliation-test stabilization.
