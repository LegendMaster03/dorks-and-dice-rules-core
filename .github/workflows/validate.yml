name: Validate Rules Core

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "**" ]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Validate browser modules
        run: |
          for file in \
            src/RulesCore.Web/wwwroot/app.js \
            src/RulesCore.Web/wwwroot/api.js \
            src/RulesCore.Web/wwwroot/ui.js \
            src/RulesCore.Web/wwwroot/ux-shell.js \
            src/RulesCore.Web/wwwroot/authoring.js \
            src/RulesCore.Web/wwwroot/rules-browser.js \
            src/RulesCore.Web/wwwroot/rule-renderers.js \
            src/RulesCore.Web/wwwroot/scope-control.js \
            src/RulesCore.Web/wwwroot/semantic-comparison.js \
            src/RulesCore.Web/wwwroot/mechanical-relationships.js \
            src/RulesCore.Web/wwwroot/source-library.js \
            src/RulesCore.Web/wwwroot/source-add.js \
            src/RulesCore.Web/wwwroot/source-removal.js \
            src/RulesCore.Web/wwwroot/concept-source-authoring.js \
            src/RulesCore.Web/wwwroot/source-normalization.js \
            src/RulesCore.Web/wwwroot/source-revision-review.js \
            src/RulesCore.Web/wwwroot/source-versioning.js \
            src/RulesCore.Web/wwwroot/source-admin.js \
            src/RulesCore.Web/wwwroot/source-access-admin.js \
            src/RulesCore.Web/wwwroot/source-acquisition-admin.js \
            src/RulesCore.Web/wwwroot/hosted-source-authoring.js \
            src/RulesCore.Web/wwwroot/campaign-baseline-authoring.js \
            tools/validate-render-lifecycle.mjs; do
            node --input-type=module --check < "$file"
          done

          node tools/validate-structured-rule-renderers.mjs

          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { RulesCoreApi } from "./src/RulesCore.Web/wwwroot/api.js";

          const api = new RulesCoreApi({ apiBaseUrl: "https://rules-core.test/tool" });
          if (typeof api.getGlobalResolvedRule !== "function"
              || typeof api.getCampaignResolvedRule !== "function"
              || typeof api.getRuleVersions !== "function"
              || typeof api.compareRuleVersions !== "function"
              || typeof api.searchSourceEntityPage !== "function"
              || typeof api.addCurrentUserSource !== "function"
              || typeof api.getCurrentUserSources !== "function"
              || typeof api.getCurrentUserSourceImportJobs !== "function"
              || typeof api.getCurrentUserSourceReconciliationIssues !== "function"
              || typeof api.getCurrentUserSourceImportJobReconciliationIssues !== "function"
              || typeof api.refreshCurrentUserSource !== "function"
              || typeof api.removeCurrentUserSource !== "function"
              || typeof api.getBundledSrds !== "function"
              || typeof api.reprocessBundledSrd !== "function") {
              throw new Error("Rules Browser/source paging/self-service source API contract is incomplete.");
          }

          globalThis.fetch = async () => new Response(
              JSON.stringify({ title: "Authentication required" }),
              { status: 401, headers: { "Content-Type": "application/json" } });

          if (await api.getOptionalSession() !== null) {
              throw new Error("Anonymous session lookup must resolve to null.");
          }
          const campaigns = await api.getOptionalCampaigns();
          if (!Array.isArray(campaigns) || campaigns.length !== 0) {
              throw new Error("Anonymous campaign lookup must resolve to an empty array.");
          }

          const appModule = fs.readFileSync(
              "./src/RulesCore.Web/wwwroot/app.js",
              "utf8");
          const uxShell = fs.readFileSync(
              "./src/RulesCore.Web/wwwroot/ux-shell.js",
              "utf8");
          const uiModule = fs.readFileSync(
              "./src/RulesCore.Web/wwwroot/ui.js",
              "utf8");
          for (const required of [
              "installRulesCoreUx",
              "installSourceAdd",
              "installSourceRemoval",
              "installMechanicalRelationships",
              "rules-core-detail.css"
          ]) {
              if (!appModule.includes(required)) {
                  throw new Error(`Rules Core app shell is missing '${required}'.`);
              }
          }
          for (const required of [
              "rules-core-topbar",
              "rules-core-nav-shell",
              "rules-core-main",
              "Cross-version",
              "Maintenance",
              "presentRenderedView",
              "presentRenderedFragment",
              "uxActiveRenderDepth",
              "wrapInPlaceViewRender",
              "rules-core-tool-disclosure",
              "getGlobalAuthoringOverview",
              "hasUnpublishedOverrideChange"
          ]) {
              if (!uxShell.includes(required)) {
                  throw new Error(`Rules Core UX shell contract is missing '${required}'.`);
              }
          }
          if (uxShell.includes("MutationObserver")) {
              throw new Error("Rules Core-owned DOM must not use MutationObserver as its render lifecycle.");
          }
          for (const required of [
              "enhanceRenderedFragment",
              "applyPresentationClasses",
              "rules-core-table-wrap",
              "rules-core-alert"
          ]) {
              if (!uiModule.includes(required)) {
                  throw new Error(`Rules Core fragment presentation contract is missing '${required}'.`);
              }
          }
          for (const stylesheet of [
              "./src/RulesCore.Web/wwwroot/rules-core.css",
              "./src/RulesCore.Web/wwwroot/rules-core-detail.css"
          ]) {
              if (!fs.existsSync(stylesheet)) {
                  throw new Error(`Rules Core stylesheet '${stylesheet}' is missing.`);
              }
          }

          const authoring = fs.readFileSync(
              "./src/RulesCore.Web/wwwroot/authoring.js",
              "utf8");
          for (const required of [
              "detail.concept.id",
              "detail.accessibleSources",
              "sourceEntityRevisionId",
              "payload.mergePatch",
              "payload.structuredPatch"
          ]) {
              if (!authoring.includes(required)) {
                  throw new Error(`Rules Lawyer browser contract is missing '${required}'.`);
              }
          }
          for (const incompatible of [
              "selectedSourceEntityRevisionId",
              "patchOperations",
              "manualDocument",
              "detail.candidates"
          ]) {
              if (authoring.includes(incompatible)) {
                  throw new Error(`Rules Lawyer browser contract contains incompatible field '${incompatible}'.`);
              }
          }

          const normalization = fs.readFileSync(
              "./src/RulesCore.Web/wwwroot/source-normalization.js",
              "utf8");
          for (const required of [
              "rules-core-idle-state",
              "mechanically identical cross-edition rules may then resolve automatically",
              "publication remains explicit"
          ]) {
              if (!normalization.includes(required)) {
                  throw new Error(`Normalization UX contract is missing '${required}'.`);
              }
          }
          if (normalization.includes("await card.loadCandidates();")) {
              throw new Error("Normalization suggestions must not eagerly load when Rules Lawyer opens.");
          }

          const rulesBrowser = fs.readFileSync(
              "./src/RulesCore.Web/wwwroot/rules-browser.js",
              "utf8");
          for (const required of [
              "rules-core-library-heading",
              "rules-core-library-revision",
              "rules-core-library-workspace",
              "navigateRuleFamily",
              "getRuleVersions",
              "Compare source versions"
          ]) {
              if (!rulesBrowser.includes(required)) {
                  throw new Error(`Rules Library browser contract is missing '${required}'.`);
              }
          }

          const uxShell = fs.readFileSync(
              "./src/RulesCore.Web/wwwroot/ux-shell.js",
              "utf8");
          for (const required of [
              "RULE_FAMILY_TABS",
              "rules-core-primary-nav",
              "rules-core-primary-tab"
          ]) {
              if (!uxShell.includes(required)) {
                  throw new Error(`Top-level Rules Core navigation is missing '${required}'.`);
              }
          }
          if (uxShell.includes('{ label: "Library", view: "library"')) {
              throw new Error("Rules Library must not remain a nested workspace navigation item.");
          }

          const library = fs.readFileSync(
              "./src/RulesCore.Web/wwwroot/source-library.js",
              "utf8");
          for (const required of [
              "BUNDLED_SRDS",
              "SRD3",
              "SRD35",
              "SRD51",
              "SRD52",
              "No account, import action, or remote host is required",
              "Availability\", \"Bundled with Rules Core",
              "entityType: \"monster\"",
              "/api/sources/entities/",
              "Copy beta payload",
              "searchSourceEntityPage",
              "← Previous",
              "Next →"
          ]) {
              if (!library.includes(required)) {
                  throw new Error(`Source Library browser contract is missing '${required}'.`);
              }
          }
          for (const incompatible of [
              "refreshHostedSource",
              "previewHostedSource",
              "Import all built-in SRDs",
              "Preview live"
          ]) {
              if (library.includes(incompatible)) {
                  throw new Error(`Normal Source Library still contains acquisition control '${incompatible}'.`);
              }
          }

          const sourceAdd = fs.readFileSync(
              "./src/RulesCore.Web/wwwroot/source-add.js",
              "utf8");
          for (const required of [
              "Add Source",
              "Upload file",
              "Web source",
              "5etools-mirror-3/5etools-src/tree/main/data",
              "addCurrentUserSource",
              "refreshCurrentUserSource",
              "getCurrentUserSourceImportJobs",
              "getCurrentUserSourceReconciliationIssues",
              "Needs reconciliation",
              "Show reconciliation details",
              "source material is available"
          ]) {
              if (!sourceAdd.includes(required)) {
                  throw new Error(`Self-service source workflow is missing '${required}'.`);
              }
          }

          const sourceRemoval = fs.readFileSync(
              "./src/RulesCore.Web/wwwroot/source-removal.js",
              "utf8");
          for (const required of [
              "Manage source access",
              "removeCurrentUserSource",
              "Stored Source Layer evidence",
              "Rules Layer decisions",
              "active import",
              "Re-adding the same source"
          ]) {
              if (!sourceRemoval.includes(required)) {
                  throw new Error(`Self-service source removal workflow is missing '${required}'.`);
              }
          }

          const hostedSourceAuthoring = fs.readFileSync(
              "./src/RulesCore.Web/wwwroot/hosted-source-authoring.js",
              "utf8");
          for (const required of [
              "Bundled SRD maintenance",
              "Reprocess stored snapshot",
              "reprocessBundledSrd",
              "does not fetch upstream",
              "Rules Layer decisions and patches"
          ]) {
              if (!hostedSourceAuthoring.includes(required)) {
                  throw new Error(`Rules Lawyer source-maintenance UI is missing '${required}'.`);
              }
          }

          const versioning = fs.readFileSync(
              "./src/RulesCore.Web/wwwroot/source-versioning.js",
              "utf8");
          if (!versioning.includes("Automatically resolved: the bound editions have the same rule-bearing content")) {
              throw new Error("Version-review UI does not surface automatic no-change resolution.");
          }
          NODE

          node tools/validate-render-lifecycle.mjs

      - name: Start disposable PostgreSQL
        run: |
          docker rm -f dorks-and-dice-rules-core-validate-postgres 2>/dev/null || true
          docker run -d --name dorks-and-dice-rules-core-validate-postgres \
            -p 127.0.0.1:55432:5432 \
            -e POSTGRES_DB=rules_core_test \
            -e POSTGRES_USER=rules_core_test \
            -e POSTGRES_PASSWORD=rules_core_test \
            postgres:18

          ready=false
          for i in {1..30}; do
            if docker exec dorks-and-dice-rules-core-validate-postgres \
              pg_isready -U rules_core_test -d rules_core_test; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            docker logs dorks-and-dice-rules-core-validate-postgres
            exit 1
          fi

      - name: Restore
        run: dotnet restore dorks-and-dice-rules-core.slnx

      - name: Test
        env:
          ConnectionStrings__RulesCore: Host=127.0.0.1;Port=55432;Database=rules_core_test;Username=rules_core_test;Password=rules_core_test
          RulesCore__BootstrapBaseline: "false"
        run: dotnet test dorks-and-dice-rules-core.slnx --configuration Release --no-restore

      - name: Cleanup disposable PostgreSQL
        if: always()
        run: docker rm -f dorks-and-dice-rules-core-validate-postgres 2>/dev/null || true

      - name: Build container
        run: docker build -t dorks-and-dice-rules-core:test -f src/RulesCore.Web/Dockerfile .

      - name: Validate Compose
        env:
          ConnectionStrings__RulesCore: "Host=postgres;Port=5432;Database=rules_core_test;Username=rules_core_test;Password=rules_core_test"
        run: docker compose -f docker-compose.yml config --quiet

      - name: Smoke test container
        run: |
          docker rm -f rules-core-smoke-app rules-core-smoke-postgres 2>/dev/null || true
          docker network rm rules-core-smoke 2>/dev/null || true
          docker network create rules-core-smoke

          docker run -d --name rules-core-smoke-postgres             --network rules-core-smoke             -e POSTGRES_DB=rules_core_smoke             -e POSTGRES_USER=rules_core_smoke             -e POSTGRES_PASSWORD=rules_core_smoke             postgres:18

          ready=false
          for i in {1..30}; do
            if docker exec rules-core-smoke-postgres               pg_isready -U rules_core_smoke -d rules_core_smoke; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            docker logs rules-core-smoke-postgres
            exit 1
          fi

          docker run -d --name rules-core-smoke-app             --network rules-core-smoke             -p 127.0.0.1:58080:8080             -e 'ConnectionStrings__RulesCore=Host=rules-core-smoke-postgres;Port=5432;Database=rules_core_smoke;Username=rules_core_smoke;Password=rules_core_smoke'             -e 'RulesCore__BootstrapBaseline=false'             dorks-and-dice-rules-core:test

          healthy=false
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:58080/health >/dev/null               && curl --fail --silent http://127.0.0.1:58080/ready >/dev/null; then
              healthy=true
              break
            fi
            sleep 1
          done
          if [ "$healthy" != "true" ]; then
            docker logs rules-core-smoke-app
            exit 1
          fi

      - name: Cleanup smoke containers
        if: always()
        run: |
          docker rm -f rules-core-smoke-app rules-core-smoke-postgres 2>/dev/null || true
          docker network rm rules-core-smoke 2>/dev/null || true
