# Native competency structures remain provisional. Validate syntax here, not schema decisions.
# Keep the established workflow/job identity for existing CI integrations.
name: Validate Rules Core Rewrite Structure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    name: Check clean-slate structure and JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON syntax without asserting draft schemas or content counts
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          paths = sorted(Path("data").rglob("*.json"))
          if not paths:
              raise SystemExit("Expected JSON source files under data/.")
          for path in paths:
              with path.open(encoding="utf-8") as stream:
                  json.load(stream)
          print(f"Validated JSON syntax in {len(paths)} files.")
          PY
