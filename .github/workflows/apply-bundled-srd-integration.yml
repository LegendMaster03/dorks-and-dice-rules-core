name: Apply Bundled SRD Integration

on:
  push:
    branches: [ "fix/bundle-canonical-srds" ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bundled-source integration
        shell: python
        run: |
          import re
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Hydrate the four canonical SRDs from embedded snapshots during baseline bootstrap.
          replace_once(
              'src/RulesCore.Infrastructure/Bootstrap/RulesCoreBaselineBootstrapper.cs',
              '''        var authorityReferenceCount = await EnsureAuthorityReferencesAsync(cancellationToken);
              var hostedSourceDefinitionCount = await BuiltInSrdHostedSources.EnsureAsync(
                  dbContext,
                  importer,
                  cancellationToken);''',
              '''        var authorityReferenceCount = await EnsureAuthorityReferencesAsync(cancellationToken);
              _ = await BundledSrdSnapshots.EnsureAsync(
                  dbContext,
                  importer,
                  cancellationToken);
              var hostedSourceDefinitionCount = await BuiltInSrdHostedSources.EnsureAsync(
                  dbContext,
                  importer,
                  cancellationToken);''')

          # Make the normal Library a public bundled-source browser, not an acquisition UI.
          library_path = Path('src/RulesCore.Web/wwwroot/source-library.js')
          library = library_path.read_text()
          library = library.replace('    setButtonBusy\n', '')
          library = library.replace(
              'const BUILT_IN_PREFIX = "builtin-wotc-srd-";',
              '''const BUNDLED_SRDS = [
              {
                  includedSourceCodes: ["SRD3"],
                  packageKey: "wotc-srd-ogl",
                  packageDisplayName: "Wizards of the Coast SRD (OGL)",
                  workKey: "srd-3e",
                  workDisplayName: "System Reference Document 3e",
                  editionKey: "original",
                  editionDisplayName: "3e SRD",
                  gameEdition: "3e",
                  provider: "Wizards of the Coast",
                  license: "OGL-1.0a",
                  note: "Reviewed 3e SRD snapshot bundled with Rules Core. The archived SRD distribution remains the corpus-membership authority."
              },
              {
                  includedSourceCodes: ["SRD35"],
                  packageKey: "wotc-srd-ogl",
                  packageDisplayName: "Wizards of the Coast SRD (OGL)",
                  workKey: "srd-3-5e",
                  workDisplayName: "System Reference Document 3.5e",
                  editionKey: "original",
                  editionDisplayName: "3.5e SRD",
                  gameEdition: "3.5e",
                  provider: "Wizards of the Coast",
                  license: "OGL-1.0a",
                  note: "Reviewed 3.5e SRD snapshot bundled with Rules Core from the pinned representation."
              },
              {
                  includedSourceCodes: ["SRD51"],
                  packageKey: "wotc-srd-cc",
                  packageDisplayName: "Wizards of the Coast SRD (Creative Commons)",
                  workKey: "srd-5-1",
                  workDisplayName: "System Reference Document 5.1",
                  editionKey: "5.1",
                  editionDisplayName: "SRD 5.1",
                  gameEdition: "5e",
                  provider: "Wizards of the Coast",
                  license: "CC-BY-4.0",
                  note: "Reviewed SRD 5.1 snapshot bundled with Rules Core."
              },
              {
                  includedSourceCodes: ["SRD52"],
                  packageKey: "wotc-srd-cc",
                  packageDisplayName: "Wizards of the Coast SRD (Creative Commons)",
                  workKey: "srd-5-2-1",
                  workDisplayName: "System Reference Document 5.2.1",
                  editionKey: "5.2.1",
                  editionDisplayName: "SRD 5.2.1",
                  gameEdition: "5.5e",
                  provider: "Wizards of the Coast",
                  license: "CC-BY-4.0",
                  note: "Reviewed SRD 5.2.1 snapshot bundled with Rules Core."
              }
          ];''')
          library = library.replace(
              'text: "Source material lives here before Rules Lawyer adjudication. Importing an SRD does not automatically make it the table rule; it makes the source available for browsing, normalization, and review."',
              'text: "Canonical SRDs are bundled with Rules Core and available here before Rules Lawyer adjudication. Browsing a source does not make it the table rule; publication remains an explicit decision."')

          library, count = re.subn(
              r'\n    let builtIns = \[\];.*?\n    await renderSourceBrowser\(app, container\);',
              '''
              await renderBuiltInSources(app, container, BUNDLED_SRDS);

              await renderSourceBrowser(app, container);''',
              library,
              count=1,
              flags=re.S)
          if count not in (0, 1):
              raise SystemExit('Unexpected Rules Library source-selection replacement count')

          new_builtins = '''async function renderBuiltInSources(app, container, definitions) {
              const section = element("section", { className: "mb-3" });
              const heading = element("div", {
                  className: "d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2"
              });
              heading.append(
                  element("div", {},
                      element("h4", { className: "h5 mb-1", text: "Bundled SRDs" }),
                      element("p", {
                          className: "text-body-secondary small mb-0",
                          text: "These reviewed snapshots ship with Rules Core and are hydrated into the public immutable Source Layer during baseline bootstrap. No account, import action, or remote host is required to use them."
                      })));
              section.append(heading);

              const stateHolder = element("div", { className: "rules-core-source-grid" });
              section.append(stateHolder);
              container.append(section);

              const states = await Promise.all(definitions.map(definition => loadDefinitionState(app, definition)));
              const readyCount = states.filter(value => value.ready).length;
              const detectedMonsterCount = states.reduce((sum, value) => sum + value.monsterCount, 0);
              const monsterCountCapped = states.some(value => value.monsterCapped);

              const summary = element("div", { className: "rules-core-library-summary card card-body mb-3" });
              summary.append(
                  element("div", { className: "rules-core-metrics" },
                      metric("Bundled SRDs", String(definitions.length)),
                      metric("Available locally", `${readyCount}/${definitions.length}`),
                      metric("Detected monsters", `${detectedMonsterCount}${monsterCountCapped ? "+" : ""}`)),
                  element("span", {
                      className: "small text-body-secondary",
                      text: "Upstream comparison and maintenance controls remain under Advanced; normal library use is entirely local."
                  }));
              section.insertBefore(summary, stateHolder);

              clear(stateHolder);
              for (const state of states) {
                  stateHolder.append(renderSourceCard(app, container, state));
              }
          }

          '''
          library, count2 = re.subn(
              r'async function renderBuiltInSources\(app, container, definitions\) \{.*?\n\}\n\n(?=async function loadDefinitionState)',
              new_builtins,
              library,
              count=1,
              flags=re.S)
          if count2 not in (0, 1):
              raise SystemExit('Unexpected bundled source renderer replacement count')

          new_card = '''function renderSourceCard(app, container, state) {
              const definition = state.definition;
              const card = element("article", { className: "card card-body rules-core-source-card" });
              const titleRow = element("div", {
                  className: "d-flex justify-content-between align-items-start gap-2 mb-3"
              });
              titleRow.append(
                  element("div", {},
                      element("div", { className: "rules-core-eyebrow", text: definition.gameEdition ?? "D&D" }),
                      element("h5", { className: "h5 mb-1", text: definition.editionDisplayName }),
                      element("div", { className: "small text-body-secondary", text: definition.workDisplayName })),
                  state.error
                      ? badge("Status error", "danger")
                      : state.ready
                          ? badge("Bundled", "success")
                          : badge("Bundle unavailable", "danger"));
              card.append(titleRow);

              card.append(element("div", { className: "rules-core-source-card-stats" },
                  metric("Entities", countLabel(state.entityCount, state.entityCapped)),
                  metric("Monsters", countLabel(state.monsterCount, state.monsterCapped)),
                  metric("Loaded", state.latestImportedAt ? formatDate(state.latestImportedAt) : "Unavailable")));

              if (state.error) {
                  card.append(alertNode("warning", describeError(state.error)));
              } else if (!state.ready) {
                  card.append(alertNode(
                      "danger",
                      "This bundled SRD is missing from the local Source Layer. Baseline bootstrap should hydrate it automatically; there is no user import action."));
              }

              const actions = element("div", { className: "d-flex flex-wrap gap-2 mt-3" });
              const browse = element("button", {
                  type: "button",
                  className: "btn btn-sm btn-outline-primary",
                  text: "Browse source"
              });
              browse.disabled = !state.ready;
              browse.addEventListener("click", async () => {
                  app.libraryFilters = { entityType: "", query: state.sourceCode };
                  await renderSourceLibrary(app, container);
                  document.getElementById("rules-core-source-browser")?.scrollIntoView({ behavior: "smooth", block: "start" });
              });

              const monsters = element("button", {
                  type: "button",
                  className: "btn btn-sm btn-outline-primary",
                  text: "Monsters"
              });
              monsters.disabled = !state.monsterCount;
              monsters.addEventListener("click", async () => {
                  app.libraryFilters = { entityType: "monster", query: state.sourceCode };
                  await renderSourceLibrary(app, container);
                  document.getElementById("rules-core-source-browser")?.scrollIntoView({ behavior: "smooth", block: "start" });
              });

              actions.append(browse, monsters);
              card.append(actions);

              const details = element("details", { className: "mt-3 small" });
              details.append(
                  element("summary", { className: "text-body-secondary", text: "Source and provenance details" }),
                  element("div", { className: "pt-2" },
                      definitionList([
                          ["Source code", state.sourceCode],
                          ["Package", definition.packageDisplayName],
                          ["Provider", definition.provider],
                          ["License", definition.license ?? "—"],
                          ["Availability", "Bundled with Rules Core"]
                      ]),
                      element("p", { className: "text-body-secondary mb-0", text: definition.note ?? "" })));
              card.append(details);
              return card;
          }

          '''
          library, count3 = re.subn(
              r'function renderSourceCard\(app, container, state\) \{.*?\n\}\n\n(?=async function previewDefinition)',
              new_card,
              library,
              count=1,
              flags=re.S)
          if count3 not in (0, 1):
              raise SystemExit('Unexpected bundled source card replacement count')

          library, count4 = re.subn(
              r'async function previewDefinition\(.*?\n(?=async function renderSourceBrowser)',
              '',
              library,
              count=1,
              flags=re.S)
          if count4 not in (0, 1):
              raise SystemExit('Unexpected acquisition-function removal count')

          library = library.replace('text: "Browse imported source material"', 'text: "Browse source material"')
          library = library.replace(
              '? "No imported monster entities match these filters. Import an SRD above, then search again."\n                    : "No imported source entities match these filters."',
              '? "No monster entities match these filters."\n                    : "No source entities match these filters."')
          library = library.replace('workflowStep("1", "Sources", "Import and inspect"', 'workflowStep("1", "Sources", "Browse and inspect"')
          library = re.sub(
              r'\nfunction compareBuiltIns\(left, right\) \{.*?\n\}\n',
              '\n',
              library,
              count=1,
              flags=re.S)
          library_path.write_text(library)

          # Prove that no-user source search sees all four bundled source codes and repeat bootstrap is idempotent.
          test_path = Path('tests/RulesCore.IntegrationTests/BaselineBootstrapIntegrationTests.cs')
          test = test_path.read_text()
          marker = '''            Assert.True(packages.Single(value => value.Key == "wotc-srd-cc").IsPublic);
              Assert.Equal("CC-BY-4.0", packages.Single(value => value.Key == "wotc-srd-cc").License);
              Assert.True(packages.Single(value => value.Key == "loot-tavern-free").IsPublic);'''
          addition = '''            Assert.True(packages.Single(value => value.Key == "wotc-srd-cc").IsPublic);
              Assert.Equal("CC-BY-4.0", packages.Single(value => value.Key == "wotc-srd-cc").License);

              var anonymousSourceSearch = new SourceEntitySearchService(db);
              foreach (var sourceCode in new[] { "SRD3", "SRD35", "SRD51", "SRD52" })
              {
                  var visible = await anonymousSourceSearch.SearchAccessibleAsync(
                      userId: null,
                      query: sourceCode,
                      limit: 1);
                  Assert.NotEmpty(visible);
              }

              Assert.True(packages.Single(value => value.Key == "loot-tavern-free").IsPublic);'''
          if 'var anonymousSourceSearch = new SourceEntitySearchService(db);' not in test:
              if marker not in test:
                  raise SystemExit('Baseline public-package assertion marker was not found')
              test = test.replace(marker, addition, 1)

          second_marker = '''            var second = await bootstrapper.EnsureAsync();
              Assert.False(second.RulesBaselineApplied);'''
          second_replacement = '''            var sourceRevisionCountBeforeRepeat = await db.SourceEntityRevisions.CountAsync();
              var second = await bootstrapper.EnsureAsync();
              Assert.Equal(sourceRevisionCountBeforeRepeat, await db.SourceEntityRevisions.CountAsync());
              Assert.False(second.RulesBaselineApplied);'''
          if 'sourceRevisionCountBeforeRepeat' not in test:
              if second_marker not in test:
                  raise SystemExit('Repeat-bootstrap marker was not found')
              test = test.replace(second_marker, second_replacement, 1)
          test_path.write_text(test)

          # Update architecture docs to distinguish bundled availability from optional hosted maintenance.
          baseline_path = Path('docs/baseline-bootstrap.md')
          baseline = baseline_path.read_text()
          baseline = baseline.replace(
              '''1. ensures the built-in source package/work/release identities exist;
          2. records corpus-membership authority references for the 3e, 3.5e, 5.1, and 5.2.1 SRDs;
          3. registers four public persistent hosted-source definitions used to acquire parseable SRD representations;
          4. imports the local immutable Dorks & Dice baseline-rule source document;
          5. on a fresh Rules Layer only, creates the settled baseline concepts/decisions and publishes the first global ruleset.''',
              '''1. ensures the built-in source package/work/release identities exist;
          2. records corpus-membership authority references for the 3e, 3.5e, 5.1, and 5.2.1 SRDs;
          3. hydrates reviewed bundled snapshots of all four canonical SRDs into the public immutable Source Layer when they are not already present;
          4. registers four persistent hosted-source definitions as Advanced maintenance metadata for deliberate upstream comparison/rebuild work;
          5. imports the local immutable Dorks & Dice baseline-rule source document;
          6. on a fresh Rules Layer only, creates the settled baseline concepts/decisions and publishes the first global ruleset.''')
          baseline = baseline.replace(
              '''Startup does **not** fetch any remote SRD corpus. Remote URLs are persistent acquisition definitions; a Rules Lawyer can preview and refresh them through the Hosted Sources workflow. Runtime rule reads therefore never require the representation host or authority archive to be online.''',
              '''Startup does **not** fetch any remote SRD corpus. The reviewed 3e, 3.5e, 5.1, and 5.2.1 snapshots are embedded in the Rules Core build and hydrated locally. They are public Source Layer material immediately after baseline bootstrap, including for anonymous consumers. Runtime source/rule reads therefore never require Dragon.ee, GitHub, or an authority archive to be online.''')
          baseline = baseline.replace(
              '''All four definitions are acquisition metadata only until explicitly previewed/refreshed. Bootstrap does not hydrate their remote content.''',
              '''The hosted definitions are Advanced maintenance metadata only. Normal Library availability comes from the embedded reviewed snapshots, not from previewing or refreshing these definitions. A maintainer can deliberately compare/rebuild a future snapshot from the pinned upstream representations without making ordinary users depend on those hosts.''')
          baseline = baseline.replace(
              'Rules Core registers and can acquire the public Wizards of the Coast SRDs under package `wotc-srd-ogl`:',
              'Rules Core ships and hydrates the public Wizards of the Coast SRDs under package `wotc-srd-ogl`:')
          baseline = baseline.replace(
              'Rules Core registers the Wizards SRDs under package `wotc-srd-cc`:',
              'Rules Core ships and hydrates the Wizards SRDs under package `wotc-srd-cc`:')
          baseline = baseline.replace(
              'Dedicated tests verify source identities, Source Layer ownership of authority-reference schema, all four authority references, all four persistent SRD definitions,',
              'Dedicated tests verify source identities, Source Layer ownership of authority-reference schema, all four authority references, all four bundled SRD snapshots and persistent maintenance definitions, anonymous bundled-source visibility, repeat-bootstrap idempotence,')
          baseline_path.write_text(baseline)

          hosted_path = Path('docs/hosted-sources.md')
          hosted = hosted_path.read_text()
          hosted = hosted.replace(
              '''## Runtime boundary

          Hosted-source resolution is an acquisition operation, not a runtime dependency. Startup registers definitions and authority metadata but performs no remote fetch. A Rules Lawyer explicitly previews or refreshes a hosted definition; the resulting normalized entities are then stored as immutable Source Layer revisions. Rules resolution reads those local revisions and continues to work when the representation host is unavailable.''',
              '''## Runtime boundary

          Hosted-source resolution is an acquisition/maintenance operation, not a runtime dependency. The four canonical Wizards SRDs are different from ordinary hosted sources: reviewed snapshots are embedded in Rules Core and baseline bootstrap hydrates them into the public immutable Source Layer without any remote fetch. Anonymous and signed-in consumers therefore use the same local canonical source data immediately after deployment.

          The corresponding hosted definitions remain available under Advanced for deliberate maintainer comparison or snapshot-rebuild work. A Rules Lawyer can still preview or refresh other hosted definitions into immutable Source Layer revisions, but normal Library use never requires a remote host.''')
          hosted_path.write_text(hosted)
      - name: Commit integration changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/RulesCore.Infrastructure/Bootstrap/RulesCoreBaselineBootstrapper.cs \
            src/RulesCore.Web/wwwroot/source-library.js \
            tests/RulesCore.IntegrationTests/BaselineBootstrapIntegrationTests.cs \
            docs/baseline-bootstrap.md \
            docs/hosted-sources.md
          if git diff --cached --quiet; then
            echo "Bundled SRD integration already applied."
            exit 0
          fi
          git commit -m "Hydrate bundled SRDs for public library access"
          git push origin HEAD:fix/bundle-canonical-srds
