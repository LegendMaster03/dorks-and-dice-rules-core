name: Official SRD Source Extraction
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/import_official_srd_pages.py'
      - 'tools/import_official_srd52_animals.mjs'
      - 'data/rulesets/dnd-5-5e/native/bestiary/animals-*.json'
      - 'data/reference/srd/official-animals-import.json'
      - 'data/reference/srd/structured/bestiary/bestiary-srd52.json'
      - 'data/rulesets/dnd-5e/native/rulebook/**'
      - 'data/rulesets/dnd-5-5e/native/rulebook/**'
      - 'data/reference/srd/official-page-import.json'
      - '.github/workflows/official-srd-source-extraction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: srd-5.1
            url: https://media.dndbeyond.com/compendium-images/srd/5.1/SRD_CC_v5.1.pdf
          - edition: srd-5.2.1
            url: https://media.dndbeyond.com/compendium-images/srd/5.2/SRD_CC_v5.2.1.pdf
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF text extraction
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Retrieve publisher source
        env:
          OFFICIAL_URL: ${{ matrix.url }}
        run: curl --fail --location --retry 3 --silent --show-error "$OFFICIAL_URL" -o /tmp/official-srd.pdf
      - name: Extract and inventory publisher pages
        env:
          EDITION: ${{ matrix.edition }}
        run: python3 tools/import_official_srd_pages.py "$EDITION" /tmp/official-srd.pdf --output build/official-srd --check
      - name: Reproduce structured Animals catalog from validated publisher pages
        if: matrix.edition == 'srd-5.2.1'
        run: node tools/import_official_srd52_animals.mjs --check
      - uses: actions/upload-artifact@v4
        with:
          name: official-source-${{ matrix.edition }}
          path: build/official-srd/
          if-no-files-found: error
