name: SRD Edition Review Catalogs
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/stage_srd_editions.py'
      - 'tools/build_srd_loader_fixtures.py'
      - 'tests/NativeCatalogFingerprint/**'
      - 'src/RulesCore.Content/**'
      - 'tools/inventory_srd_editions.py'
      - 'tools/report_srd_promotion.py'
      - 'tools/promote_srd_bestiary.mjs'
      - 'tools/promote_srd_items.mjs'
      - 'tools/promote_srd_origins.mjs'
      - 'tools/promote_srd_classes.mjs'
      - 'tools/promote_srd_features.mjs'
      - 'data/reference/srd/feature-promotion-*.json'
      - 'data/reference/srd/class-promotion-*.json'
      - 'data/reference/srd/origins-promotion-*.json'
      - 'data/reference/srd/item-promotion-*.json'
      - 'data/reference/srd/bestiary-promotion-*.json'
      - 'data/rulesets/dnd-5e/native/**'
      - 'data/rulesets/dnd-5-5e/native/**'
      - 'data/reference/srd/structured/**'
      - 'data/reference/srd/structured-manifest.json'
      - '.github/workflows/srd-edition-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-review-catalogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated edition review catalogs
        run: python3 tools/stage_srd_editions.py --output build/srd-review
      - name: Verify structured feats and optional features source projection
        run: node tools/promote_srd_features.mjs --check
      - name: Verify structured class source projection
        run: node tools/promote_srd_classes.mjs --check
      - name: Verify structured character origins source projection
        run: node tools/promote_srd_origins.mjs --check
      - name: Verify structured item source projection
        run: node tools/promote_srd_items.mjs --check
      - name: Verify structured bestiary source projection
        run: node tools/promote_srd_bestiary.mjs --check
      - name: Reconcile native promotion coverage (diagnostic only)
        run: python3 tools/report_srd_promotion.py --output build/srd-review/promotion-coverage.json
      - name: Publish review inventory to summary
        run: |
          echo '## Unreviewed SRD candidate inventory' >> "$GITHUB_STEP_SUMMARY"
          echo 'The artifact is reference-only; no runtime promotion.' >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import json; d=json.load(open("build/srd-review/srd-review-summary.json")); print("\n".join("- {}: {} candidates".format(k, v["count"]) for k,v in d.items()))' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate complete candidate-sized isolated catalogs with the C# loader
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_srd_loader_fixtures.py
          for id in dnd-5e dnd-5-5e; do
            result=$(dotnet run --project tests/NativeCatalogFingerprint/NativeCatalogFingerprint.csproj --configuration Release -- build/srd-loader-fixtures "$id")
            printf '%s\n' "$result"
            grep -qx "RULESET_ID=$id" <<< "$result"
            grep -qx 'CONTENT_FINGERPRINT_VALIDATED=true' <<< "$result"
            expected=$(python3 -c 'import json,sys; print(json.load(open("build/srd-loader-fixtures/expected-counts.json"))[sys.argv[1]])' "$id")
            grep -qx "NATIVE_ENTITY_COUNT=$expected" <<< "$result"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: srd-edition-review-catalogs
          path: build/srd-review/
          retention-days: 30
          if-no-files-found: error
