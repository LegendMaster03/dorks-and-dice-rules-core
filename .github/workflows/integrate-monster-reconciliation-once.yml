name: Integrate monster reconciliation with rewrite (one-time)

on:
  push:
    branches:
      - feature/rules-core-baseline-consistency
    paths:
      - .github/workflows/integrate-monster-reconciliation-once.yml

permissions:
  contents: write

jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge latest rewrite into monster reconciliation (do not modify rewrite)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/rules-core-rewrite
          echo "Feature head: $(git rev-parse HEAD)"
          echo "Rewrite head: $(git rev-parse origin/feature/rules-core-rewrite)"
          if ! git merge --no-commit --no-ff origin/feature/rules-core-rewrite; then
            echo "Reconciling known SRD fidelity and native baseline conflicts"
            git diff --name-only --diff-filter=U
            python3 tools/resolve_rewrite_merge_once.py
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Run all Python regression tests after native/source reconciliation
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Audit native baseline
        run: python3 tools/audit_native_baseline.py
      - name: Commit tested integration to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/integrate-monster-reconciliation-once.yml
          rm tools/resolve_rewrite_merge_once.py
          git add -u .github/workflows/integrate-monster-reconciliation-once.yml tools/resolve_rewrite_merge_once.py
          git commit -m "merge(rewrite): integrate validated monster reconciliation with current rewrite"
          git push origin HEAD:feature/rules-core-baseline-consistency
