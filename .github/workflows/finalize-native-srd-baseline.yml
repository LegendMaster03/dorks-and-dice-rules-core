name: One-time native baseline finalization

on:
  push:
    branches: [feature/rules-core-rewrite]
    paths:
      - .github/workflows/finalize-native-srd-baseline.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Normalize staged entities and verify original native rulings
        run: |
          set -euo pipefail
          python3 tools/_finalize_native_srd_once.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit cleaned native baseline
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/rules-core-rewrite"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/native data/reference/srd/native-coverage-manifest.json tests/test_shared_conditions.py
          if ! git diff --cached --quiet; then
            git -c commit.gpgsign=false commit -m "fix(rewrite): normalize native SRD IDs and protect pending conditions"
            git push origin HEAD:feature/rules-core-rewrite
          fi
