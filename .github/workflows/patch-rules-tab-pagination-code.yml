          text = replace_once(text,
          '''                return Results.Ok(await catalog.GetGlobalAsync(\n                    userId,\n                    entityType,\n                    q,\n                    limit ?? 200,\n                    cancellationToken));''',
          '''                return Results.Ok(await catalog.GetGlobalPageAsync(\n                    userId,\n                    entityType,\n                    q,\n                    limit ?? 200,\n                    offset ?? 0,\n                    cancellationToken));''', 'global catalog endpoint page call')
          text = replace_once(text,
          '''                return Results.Ok(await catalog.GetCampaignAsync(\n                    campaignId,\n                    authenticationContext!.User.Id,\n                    entityType,\n                    q,\n                    limit ?? 200,\n                    cancellationToken));''',
          '''                return Results.Ok(await catalog.GetCampaignPageAsync(\n                    campaignId,\n                    authenticationContext!.User.Id,\n                    entityType,\n                    q,\n                    limit ?? 200,\n                    offset ?? 0,\n                    cancellationToken));''', 'campaign catalog endpoint page call')
          save(path, text)

          path = 'src/RulesCore.Web/wwwroot/source-versioning.js'
          text = load(path)
          text = text.replace('''    setButtonBusy\n} from "./ui.js";''', '''    setButtonBusy,\n    DEFAULT_PAGE_SIZE,\n    paginationControls\n} from "./ui.js";''')
          old = '''    form.addEventListener("submit", async event => {\n        event.preventDefault();\n        results.replaceChildren(element("div", { className: "text-body-secondary", text: "Searching…" }));\n        try {\n            const sources = await app.api.searchSourceEntities({\n                entityType: type.value.trim() || null,\n                query: query.value.trim() || null,\n                limit: 100\n            });\n            renderSourceSearchResults(app, results, sources);\n        } catch (error) {\n            results.replaceChildren(alertNode("danger", describeError(error)));\n        }\n    });\n}\n\nfunction renderSourceSearchResults(app, container, sources) {\n'''
          new = '''    let page = 0;\n    const load = async (resetPage = false) => {\n        if (resetPage) page = 0;\n        results.replaceChildren(element("div", { className: "text-body-secondary", text: "Searching…" }));\n        try {\n            const requested = await app.api.searchSourceEntityPage({\n                entityType: type.value.trim() || null,\n                query: query.value.trim() || null,\n                limit: DEFAULT_PAGE_SIZE + 1,\n                offset: page * DEFAULT_PAGE_SIZE\n            });\n            const hasNext = requested.length > DEFAULT_PAGE_SIZE;\n            const sources = requested.slice(0, DEFAULT_PAGE_SIZE);\n            if (!sources.length && page > 0) {\n                page -= 1;\n                await load(false);\n                return;\n            }\n            renderSourceSearchResults(app, results, sources, page, hasNext, async nextPage => {\n                page = nextPage;\n                await load(false);\n            });\n        } catch (error) {\n            results.replaceChildren(alertNode("danger", describeError(error)));\n        }\n    };\n\n    form.addEventListener("submit", async event => {\n        event.preventDefault();\n        await load(true);\n    });\n}\n\nfunction renderSourceSearchResults(app, container, sources, page, hasNext, onPage) {\n'''
          text = replace_once(text, old, new, 'cross-version paged search')
          text = replace_once(text,
          '''    container.append(list);\n}\n\nasync function renderDetection''',
          '''    container.append(\n        list,\n        paginationControls({\n            page,\n            itemCount: sources.length,\n            hasNext,\n            onPage\n        }));\n}\n\nasync function renderDetection''', 'cross-version navigation')
          save(path, text)

          path = 'src/RulesCore.Web/wwwroot/concept-source-authoring.js'
          text = load(path)
          text = text.replace('''    formatDate,\n    setButtonBusy\n} from "./ui.js";''', '''    formatDate,\n    setButtonBusy,\n    DEFAULT_PAGE_SIZE,\n    paginationControls\n} from "./ui.js";''')
          old = '''    const runSearch = async () => {\n        status.replaceChildren();\n        results.replaceChildren();\n        setButtonBusy(searchButton, true, "Searching…");\n        try {\n            const sources = await app.api.searchSourceEntities({\n                entityType: type.input.value.trim() || null,\n                query: query.input.value.trim() || null,\n                limit: 100\n            });\n            renderSourceResults(app, container, detail, results, sources);\n        } catch (error) {\n            status.replaceChildren(alertNode("danger", describeError(error)));\n        } finally {\n            setButtonBusy(searchButton, false);\n        }\n    };\n\n    searchButton.addEventListener("click", runSearch);\n'''
          new = '''    let page = 0;\n    const runSearch = async (resetPage = false) => {\n        if (resetPage) page = 0;\n        status.replaceChildren();\n        results.replaceChildren();\n        setButtonBusy(searchButton, true, "Searching…");\n        try {\n            const requested = await app.api.searchSourceEntityPage({\n                entityType: type.input.value.trim() || null,\n                query: query.input.value.trim() || null,\n                limit: DEFAULT_PAGE_SIZE + 1,\n                offset: page * DEFAULT_PAGE_SIZE\n            });\n            const hasNext = requested.length > DEFAULT_PAGE_SIZE;\n            const sources = requested.slice(0, DEFAULT_PAGE_SIZE);\n            if (!sources.length && page > 0) {\n                page -= 1;\n                await runSearch(false);\n                return;\n            }\n            renderSourceResults(app, container, detail, results, sources, page, hasNext, async nextPage => {\n                page = nextPage;\n                await runSearch(false);\n            });\n        } catch (error) {\n            status.replaceChildren(alertNode("danger", describeError(error)));\n        } finally {\n            setButtonBusy(searchButton, false);\n        }\n    };\n\n    searchButton.addEventListener("click", () => runSearch(true));\n'''
          text = replace_once(text, old, new, 'source binding paged search')
