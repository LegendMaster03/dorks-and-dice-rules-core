          text = replace_once(text, '''function renderSourceResults(app, container, detail, results, sources) {''', '''function renderSourceResults(app, container, detail, results, sources, page, hasNext, onPage) {''', 'source binding render signature')
          text = replace_once(text,
          '''    results.append(element("div", { className: "table-responsive" }, table));\n}\n''',
