          global_old = '''    Task<ResolvedRulesCatalogView> GetGlobalAsync(\n        string? userId,\n        string? entityType = null,\n        string? query = null,\n        int limit = 200,\n        CancellationToken cancellationToken = default);\n'''
          global_new = global_old + '''\n    Task<ResolvedRulesCatalogView> GetGlobalPageAsync(\n        string? userId,\n        string? entityType = null,\n        string? query = null,\n        int limit = 200,\n        int offset = 0,\n        CancellationToken cancellationToken = default);\n'''
          text = replace_once(text, global_old, global_new, 'resolved global page contract')
          campaign_old = '''    Task<ResolvedRulesCatalogView> GetCampaignAsync(\n        Guid campaignId,\n        string userId,\n        string? entityType = null,\n        string? query = null,\n        int limit = 200,\n        CancellationToken cancellationToken = default);\n'''
          campaign_new = campaign_old + '''\n    Task<ResolvedRulesCatalogView> GetCampaignPageAsync(\n        Guid campaignId,\n        string userId,\n        string? entityType = null,\n        string? query = null,\n        int limit = 200,\n        int offset = 0,\n        CancellationToken cancellationToken = default);\n'''
          text = replace_once(text, campaign_old, campaign_new, 'resolved campaign page contract')
          save(path, text)

          path = 'src/RulesCore.Infrastructure/Rules/ResolvedRulesCatalogService.cs'
          text = load(path)
          old = '''    public async Task<ResolvedRulesCatalogView> GetGlobalAsync(\n        string? userId,\n        string? entityType = null,\n        string? query = null,\n        int limit = 200,\n        CancellationToken cancellationToken = default)\n    {\n        ValidateLimit(limit);\n'''
          new = '''    public Task<ResolvedRulesCatalogView> GetGlobalAsync(\n        string? userId,\n        string? entityType = null,\n        string? query = null,\n        int limit = 200,\n        CancellationToken cancellationToken = default) =>\n        GetGlobalPageAsync(userId, entityType, query, limit, 0, cancellationToken);\n\n    public async Task<ResolvedRulesCatalogView> GetGlobalPageAsync(\n        string? userId,\n        string? entityType = null,\n        string? query = null,\n        int limit = 200,\n        int offset = 0,\n        CancellationToken cancellationToken = default)\n    {\n        ValidateLimit(limit);\n        ValidateOffset(offset);\n'''
          text = replace_once(text, old, new, 'global catalog page wrapper')
          old = '''    public async Task<ResolvedRulesCatalogView> GetCampaignAsync(\n        Guid campaignId,\n        string userId,\n        string? entityType = null,\n        string? query = null,\n        int limit = 200,\n        CancellationToken cancellationToken = default)\n    {\n        RequireGuid(campaignId, nameof(campaignId));\n        ValidateLimit(limit);\n'''
          new = '''    public Task<ResolvedRulesCatalogView> GetCampaignAsync(\n        Guid campaignId,\n        string userId,\n        string? entityType = null,\n        string? query = null,\n        int limit = 200,\n        CancellationToken cancellationToken = default) =>\n        GetCampaignPageAsync(campaignId, userId, entityType, query, limit, 0, cancellationToken);\n\n    public async Task<ResolvedRulesCatalogView> GetCampaignPageAsync(\n        Guid campaignId,\n        string userId,\n        string? entityType = null,\n        string? query = null,\n        int limit = 200,\n        int offset = 0,\n        CancellationToken cancellationToken = default)\n    {\n        RequireGuid(campaignId, nameof(campaignId));\n        ValidateLimit(limit);\n        ValidateOffset(offset);\n'''
          text = replace_once(text, old, new, 'campaign catalog page wrapper')
          text = text.replace(
          '''            .ThenBy(value => value.RuleConcept.Key)\n            .Select(value => new ResolvedRuleCatalogItemView(''',
          '''            .ThenBy(value => value.RuleConcept.Key)\n            .ThenBy(value => value.RuleConceptId)\n            .Skip(offset)\n            .Select(value => new ResolvedRuleCatalogItemView(''')
          marker = '''    private static string? NormalizeOptional(string? value) =>\n'''
