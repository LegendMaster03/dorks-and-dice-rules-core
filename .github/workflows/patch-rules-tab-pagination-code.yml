          save(path, text)

          path = 'src/RulesCore.Web/wwwroot/rules-browser.js'
          text = load(path)
          text = text.replace('''    formatDate,\n    setButtonBusy\n} from "./ui.js";''', '''    formatDate,\n    setButtonBusy,\n    DEFAULT_PAGE_SIZE,\n    paginationControls\n} from "./ui.js";''')
          text = replace_once(text, '''    app.browserScope = "global";\n''', '''    app.browserScope = "global";\n    app.browserPage = 0;\n    app.browserFilters = { entityType: "", query: "" };\n''', 'rules browser state')
          text = replace_once(text,
