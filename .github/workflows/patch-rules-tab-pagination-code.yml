          old = '''    public async Task<IReadOnlyList<SourceNormalizationCandidateView>> GetCandidatesAsync(\n        string userId,\n        string? entityType = null,\n        string? query = null,\n        int limit = 100,\n        CancellationToken cancellationToken = default)\n    {\n        var normalizedUserId = RequireUserId(userId);\n'''
          new = '''    public Task<IReadOnlyList<SourceNormalizationCandidateView>> GetCandidatesAsync(\n        string userId,\n        string? entityType = null,\n        string? query = null,\n        int limit = 100,\n        CancellationToken cancellationToken = default) =>\n        GetCandidatesPageAsync(userId, entityType, query, limit, 0, cancellationToken);\n\n    public async Task<IReadOnlyList<SourceNormalizationCandidateView>> GetCandidatesPageAsync(\n        string userId,\n        string? entityType = null,\n        string? query = null,\n        int limit = 100,\n        int offset = 0,\n        CancellationToken cancellationToken = default)\n    {\n        var normalizedUserId = RequireUserId(userId);\n'''
          text = replace_once(text, old, new, 'normalization service page wrapper')
          text = replace_once(text,
          '''        if (limit is < 1 or > 200)\n        {\n            throw new ArgumentOutOfRangeException(nameof(limit), "Limit must be between 1 and 200.");\n        }\n\n        var normalizedEntityType''',
          '''        if (limit is < 1 or > 200)\n        {\n            throw new ArgumentOutOfRangeException(nameof(limit), "Limit must be between 1 and 200.");\n        }\n        if (offset < 0)\n        {\n            throw new ArgumentOutOfRangeException(nameof(offset), "Offset can not be negative.");\n        }\n\n        var normalizedEntityType''', 'normalization offset validation')
          text = replace_once(text,
          '''            .OrderBy(value => value.EntityType)\n            .ThenBy(value => value.Name)\n            .ThenBy(value => value.SourceCode)\n            .Select(value => new CandidateSource(''',
          '''            .OrderBy(value => value.EntityType)\n            .ThenBy(value => value.Name)\n            .ThenBy(value => value.SourceCode)\n            .ThenBy(value => value.Id)\n            .Skip(offset)\n            .Select(value => new CandidateSource(''', 'normalization stable offset ordering')
          save(path, text)

          path = 'src/RulesCore.Web/SourceNormalizationEndpointExtensions.cs'
          text = load(path)
          text = replace_once(text,
          '''            string? q,\n            int? limit,\n            HttpContext httpContext,''',
          '''            string? q,\n            int? limit,\n            int? offset,\n            HttpContext httpContext,''', 'normalization endpoint offset parameter')
          text = replace_once(text,
          '''                return Results.Ok(await normalization.GetCandidatesAsync(\n                    authenticationContext!.User.Id,\n                    entityType,\n                    q,\n                    limit ?? 100,\n                    cancellationToken));''',
          '''                return Results.Ok(await normalization.GetCandidatesPageAsync(\n                    authenticationContext!.User.Id,\n                    entityType,\n                    q,\n                    limit ?? 100,\n                    offset ?? 0,\n                    cancellationToken));''', 'normalization endpoint paged call')
          save(path, text)

