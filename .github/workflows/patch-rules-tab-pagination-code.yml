name: Patch Rules Tab Pagination Code

on:
  push:
    branches: [ "fix/paginate-rules-tabs" ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paginate-rules-tabs

      - name: Apply pagination consistency changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def load(path):
              return Path(path).read_text()
          def save(path, text):
              Path(path).write_text(text)
          def replace_once(text, old, new, label):
              if old not in text:
                  if new in text:
                      return text
                  raise SystemExit(f"Missing replacement target: {label}")
              return text.replace(old, new, 1)

          path = 'src/RulesCore.Web/wwwroot/ui.js'
          text = load(path)
          marker = '''export function describeError(error) {\n'''
          addition = '''export const DEFAULT_PAGE_SIZE = 100;\n\nexport function paginationControls({\n    page = 0,\n    pageSize = DEFAULT_PAGE_SIZE,\n    itemCount = 0,\n    hasNext = false,\n    onPage\n}) {\n    const currentPage = Math.max(0, page);\n    const first = itemCount > 0 ? (currentPage * pageSize) + 1 : 0;\n    const last = (currentPage * pageSize) + itemCount;\n    const previous = element("button", {\n        type: "button",\n        className: "btn btn-sm btn-outline-secondary",\n        text: "← Previous",\n        disabled: currentPage === 0,\n        onClick: async () => onPage?.(Math.max(0, currentPage - 1))\n    });\n    const next = element("button", {\n        type: "button",\n        className: "btn btn-sm btn-outline-secondary",\n        text: "Next →",\n        disabled: !hasNext,\n        onClick: async () => onPage?.(currentPage + 1)\n    });\n    const range = itemCount > 0\n        ? `Showing ${first}–${last}${hasNext ? "+" : ""} · Page ${currentPage + 1}`\n        : `Page ${currentPage + 1}`;\n    return element("div", {\n        className: "d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3"\n    },\n        element("div", { className: "small text-body-secondary", text: range }),\n        element("div", { className: "d-flex gap-2" }, previous, next));\n}\n\n'''
          if 'export function paginationControls' not in text:
              text = text.replace(marker, addition + marker, 1)
          save(path, text)

          path = 'src/RulesCore.Web/wwwroot/api.js'
          text = load(path)
          text = replace_once(text,
          '''    getSourceNormalizationCandidates({ entityType = null, query = null, limit = 100 } = {}) {\n        const parameters = new URLSearchParams();\n        if (entityType) parameters.set("entityType", entityType);\n        if (query) parameters.set("q", query);\n        parameters.set("limit", String(limit));\n        return this.backend(`/api/global/rules/normalization/candidates?${parameters.toString()}`);\n    }\n''',
          '''    getSourceNormalizationCandidates({ entityType = null, query = null, limit = 100, offset = 0 } = {}) {\n        const parameters = new URLSearchParams();\n        if (entityType) parameters.set("entityType", entityType);\n        if (query) parameters.set("q", query);\n        parameters.set("limit", String(limit));\n        parameters.set("offset", String(Math.max(0, offset)));\n        return this.backend(`/api/global/rules/normalization/candidates?${parameters.toString()}`);\n    }\n''', 'normalization api offset')
          text = replace_once(text,
          '''    getGlobalRulesCatalog({ entityType = null, query = null, limit = 200 } = {}) {\n        const parameters = catalogParameters(entityType, query, limit);\n        return this.backend(`/api/rules?${parameters.toString()}`);\n    }\n\n    getCampaignRulesCatalog(campaignId, { entityType = null, query = null, limit = 200 } = {}) {\n        const parameters = catalogParameters(entityType, query, limit);\n        return this.backend(`/api/campaigns/${encodeURIComponent(campaignId)}/rules?${parameters.toString()}`);\n    }\n''',
          '''    getGlobalRulesCatalog({ entityType = null, query = null, limit = 200, offset = 0 } = {}) {\n        const parameters = catalogParameters(entityType, query, limit, offset);\n        return this.backend(`/api/rules?${parameters.toString()}`);\n    }\n\n    getCampaignRulesCatalog(campaignId, { entityType = null, query = null, limit = 200, offset = 0 } = {}) {\n        const parameters = catalogParameters(entityType, query, limit, offset);\n        return this.backend(`/api/campaigns/${encodeURIComponent(campaignId)}/rules?${parameters.toString()}`);\n    }\n''', 'catalog api offset')
          text = replace_once(text,
          '''function catalogParameters(entityType, query, limit) {\n    const parameters = new URLSearchParams();\n    if (entityType) parameters.set("entityType", entityType);\n    if (query) parameters.set("q", query);\n    parameters.set("limit", String(limit));\n    return parameters;\n}\n''',
          '''function catalogParameters(entityType, query, limit, offset = 0) {\n    const parameters = new URLSearchParams();\n    if (entityType) parameters.set("entityType", entityType);\n    if (query) parameters.set("q", query);\n    parameters.set("limit", String(limit));\n    parameters.set("offset", String(Math.max(0, offset)));\n    return parameters;\n}\n''', 'catalog parameter offset')
          save(path, text)

          path = 'src/RulesCore.Application/Rules/SourceNormalizationContracts.cs'
          text = load(path)
          old = '''    Task<IReadOnlyList<SourceNormalizationCandidateView>> GetCandidatesAsync(\n        string userId,\n        string? entityType = null,\n        string? query = null,\n        int limit = 100,\n        CancellationToken cancellationToken = default);\n'''
          new = old + '''\n    Task<IReadOnlyList<SourceNormalizationCandidateView>> GetCandidatesPageAsync(\n        string userId,\n        string? entityType = null,\n        string? query = null,\n        int limit = 100,\n        int offset = 0,\n        CancellationToken cancellationToken = default);\n'''
          text = replace_once(text, old, new, 'normalization contract page method')
          save(path, text)

