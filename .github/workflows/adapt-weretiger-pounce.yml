name: Adapt Weretiger Pounce

on:
  push:
    branches: [feature/rules-core-baseline-consistency]
    paths:
      - tools/restore_weretiger_pounce.py
      - tests/test_final_monster_removed_features.py
      - .github/workflows/adapt-weretiger-pounce.yml

permissions:
  contents: write

jobs:
  adapt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Weretiger Pounce with valid 5.5e attack references
        run: python3 tools/restore_weretiger_pounce.py
      - name: Run native rule regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Audit native identities and pending records
        run: python3 tools/audit_native_baseline.py
      - name: Commit validated data to the feature branch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rulesets/first-party-001/working data/reference/srd/monster-legacy-variant-review.json docs/rewrite/native-reconciliation-statistics.json docs/rewrite/monster-legacy-feature-results.json
          git commit -m "data(rewrite): restore adapted Weretiger Pounce and close resolved legacy question"
          git push origin HEAD:feature/rules-core-baseline-consistency
