name: Native Mechanics Feature CI

on:
  push:
    branches:
      - feature/native-mechanics-existing-tools
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mechanics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore solution
        run: dotnet restore RulesCore.slnx
      - name: Build solution
        run: dotnet build RulesCore.slnx -c Release --no-restore
      - name: Test solution
        run: dotnet test RulesCore.slnx -c Release --no-build --logger "console;verbosity=normal"
