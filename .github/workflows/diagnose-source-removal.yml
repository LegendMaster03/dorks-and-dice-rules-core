name: Diagnose Source Removal

on:
  push:
    branches: [ "feature/normalized-builtins-source-lifecycle" ]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Start disposable PostgreSQL
        run: |
          docker run -d --name rules-core-source-removal-diagnostic \
            -p 127.0.0.1:55432:5432 \
            -e POSTGRES_DB=rules_core_test \
            -e POSTGRES_USER=rules_core_test \
            -e POSTGRES_PASSWORD=rules_core_test \
            postgres:18
          for i in {1..30}; do
            if docker exec rules-core-source-removal-diagnostic \
              pg_isready -U rules_core_test -d rules_core_test; then
              exit 0
            fi
            sleep 1
          done
          docker logs rules-core-source-removal-diagnostic
          exit 1

      - name: Restore
        run: dotnet restore dorks-and-dice-rules-core.slnx

      - name: Run source removal lifecycle test
        env:
          ConnectionStrings__RulesCore: Host=127.0.0.1;Port=55432;Database=rules_core_test;Username=rules_core_test;Password=rules_core_test
          RulesCore__BootstrapBaseline: "false"
        run: >-
          dotnet test tests/RulesCore.IntegrationTests/RulesCore.IntegrationTests.csproj
          --configuration Release
          --no-restore
          --filter FullyQualifiedName~CurrentUserSourceRemovalLifecycleIntegrationTests
          --logger "console;verbosity=normal"

      - name: Cleanup disposable PostgreSQL
        if: always()
        run: docker rm -f rules-core-source-removal-diagnostic 2>/dev/null || true
