name: Patch Snapshot Tool

on:
  push:
    branches: [ "fix/bundle-canonical-srds" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add stable item-type identity
        shell: python
        run: |
          from pathlib import Path
          path = Path('tools/RulesCore.SourceSnapshotGenerator/Program.cs')
          text = path.read_text()
          old = '    string? uniqueId = entityType switch\n    {\n        "deity" => JoinIdentity(item, "pantheon"),'
          new = '    string? uniqueId = entityType switch\n    {\n        "itemType" => JoinIdentity(item, "abbreviation"),\n        "deity" => JoinIdentity(item, "pantheon"),'
          if new not in text:
              if old not in text:
                  raise SystemExit('snapshot identity switch was not found')
              path.write_text(text.replace(old, new, 1))
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/RulesCore.SourceSnapshotGenerator/Program.cs
          if git diff --cached --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git commit -m "Disambiguate bundled SRD item types"
          git push origin HEAD:fix/bundle-canonical-srds
