name: Apply Monster Family Reconciliation

on:
  push:
    branches: [feature/rules-core-baseline-consistency]
    paths:
      - tools/reconcile_monster_families.py
      - tests/test_native_baseline_coverage.py
      - .github/workflows/apply-monster-families.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply newer monster defaults and semantic role crosswalk
        run: python3 tools/reconcile_monster_families.py
      - name: Full regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Native authority audit
        run: python3 tools/audit_native_baseline.py
      - name: Commit reviewed changes only to feature branch
        run: |
          if git diff --quiet; then
            echo "No modifications."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/native data/reference/srd/native-coverage-manifest.json data/reference/srd/monster-legacy-variant-review.json docs/rewrite/native-reconciliation-statistics.json
          git commit -m "data(rewrite): reconcile 5.5 monster roles and semantic aliases"
          git push origin HEAD:feature/rules-core-baseline-consistency
