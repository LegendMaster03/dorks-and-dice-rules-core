name: Deploy native Rules Core
run-name: ${{ inputs.deployment_type }} — ${{ github.sha }}

# One-click manual release: select the deployment scope. The current main SHA
# and its successful main-push CI run are verified automatically, never typed.
on:
  workflow_dispatch:
    inputs:
      deployment_type:
        description: What should be deployed?
        type: choice
        required: true
        default: Content update
        options:
          - Content update
          - Full deploy

permissions:
  contents: read
  actions: read

concurrency:
  group: dorks-and-dice-rules-core
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, dorks-and-dice-rules-core]
    timeout-minutes: 25
    env:
      RELEASE_SHA: ${{ github.sha }}
      DEPLOYMENT_TYPE: ${{ inputs.deployment_type }}
      RULES_CORE_ENV_FILE: /mnt/HDDs/www/dorks-and-dice-rules-core/.env
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require the selected main commit and a supported deployment type
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOYMENT_TYPE" == "Content update" || "$DEPLOYMENT_TYPE" == "Full deploy" ]]
          echo "Approved by GitHub actor $GITHUB_ACTOR via workflow run $GITHUB_RUN_ID"
          echo "Scope: $DEPLOYMENT_TYPE, commit: $RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$RELEASE_SHA"
      - name: Require successful main CI for the exact release commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_NAME: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          sha = os.environ["RELEASE_SHA"]
          repo = os.environ["REPO_NAME"]
          url = ("https://api.github.com/repos/" + repo +
                 "/actions/workflows/phase3b-native-public-api-ci.yml/runs"
                 "?head_sha=" + sha + "&event=push&status=success&per_page=30")
          request = Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urlopen(request, timeout=20) as response:
              runs = json.load(response)["workflow_runs"]
          if not any(run["head_sha"] == sha and run["head_branch"] == "main" and
                     run["event"] == "push" and run["conclusion"] == "success"
                     for run in runs):
              raise SystemExit("Reviewed commit has no passing main push CI; deployment denied")
          print("Matching main CI succeeded for reviewed SHA")
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compute the loader fingerprint from the reviewed source commit
        shell: bash
        run: |
          set -euo pipefail
          result=$(dotnet run --project tests/NativeCatalogFingerprint/NativeCatalogFingerprint.csproj --configuration Release)
          printf '%s\n' "$result"
          grep -qx 'CONTENT_FINGERPRINT_VALIDATED=true' <<< "$result"
          fingerprint=$(printf '%s\n' "$result" | sed -nE 's/^CATALOG_SHA256=([0-9a-f]{64})$/\1/p')
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]
          printf 'RULES_CORE_EXPECTED_FINGERPRINT=%s\n' "$fingerprint" >> "$GITHUB_ENV"
      - name: Check host isolation before replacing services
        run: python3 tools/deploy_native_core.py preflight
      - name: Inspect unchanged running Core for content-only update
        if: inputs.deployment_type == 'Content update'
        id: content_base
        shell: bash
        run: |
          set -euo pipefail
          result=$(python3 tools/deploy_native_core.py content-base)
          printf '%s\n' "$result"
          base=$(printf '%s\n' "$result" | sed -nE 's/^CONTENT_BASE_IMAGE=(dorks-and-dice-rules-core:rewrite-[0-9a-f]{40})$/\1/p')
          [[ "$base" =~ ^dorks-and-dice-rules-core:rewrite-[0-9a-f]{40}$ ]]
          printf 'image=%s\n' "$base" >> "$GITHUB_OUTPUT"
      - name: Build content-only image (reuse unchanged running application)
        if: inputs.deployment_type == 'Content update'
        shell: bash
        env:
          BASE_IMAGE: ${{ steps.content_base.outputs.image }}
        run: |
          set -euo pipefail
          docker build -f Dockerfile.content-update \
            --build-arg "RULES_CORE_BASE_IMAGE=$BASE_IMAGE" \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            -t "dorks-and-dice-rules-core:rewrite-$RELEASE_SHA" .
      - name: Build full application and content image
        if: inputs.deployment_type == 'Full deploy'
        run: docker build --label "org.opencontainers.image.revision=$RELEASE_SHA" -t "dorks-and-dice-rules-core:rewrite-$RELEASE_SHA" .
      - name: Deploy and monitor the approved native ingresses
        run: python3 tools/deploy_native_core.py deploy
