name: Deploy Rules Core
run-name: Deploy ${{ github.event.workflow_run.head_branch || github.ref_name }} at ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows: [ "Validate Rules Core" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: dorks-and-dice-rules-core
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, dorks-and-dice-rules-core]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Build image
        timeout-minutes: 10
        run: docker build -t dorks-and-dice-rules-core:latest -f src/RulesCore.Web/Dockerfile .

      - name: Start smoke-test PostgreSQL
        timeout-minutes: 2
        run: |
          docker rm -f dorks-and-dice-rules-core-test-postgres 2>/dev/null || true
          docker network create dorks-and-dice-rules-core-test 2>/dev/null || true
          docker run -d --name dorks-and-dice-rules-core-test-postgres \
            --network dorks-and-dice-rules-core-test \
            -e POSTGRES_DB=rules_core_test \
            -e POSTGRES_USER=rules_core_test \
            -e POSTGRES_PASSWORD=rules_core_test \
            postgres:18

          consecutive=0
          for i in {1..45}; do
            result=$(docker exec dorks-and-dice-rules-core-test-postgres \
              psql -v ON_ERROR_STOP=1 -U rules_core_test -d rules_core_test -tAc 'SELECT 1' \
              2>/dev/null || true)
            if [ "$(echo "$result" | tr -d '[:space:]')" = "1" ]; then
              consecutive=$((consecutive + 1))
              if [ "$consecutive" -ge 3 ]; then
                break
              fi
            else
              consecutive=0
            fi
            sleep 1
          done

          if [ "$consecutive" -lt 3 ]; then
            echo "Smoke-test PostgreSQL did not become stably query-ready."
            docker logs dorks-and-dice-rules-core-test-postgres || true
            exit 1
          fi

      - name: Smoke test container
        timeout-minutes: 5
        run: |
          docker rm -f dorks-and-dice-rules-core-smoketest 2>/dev/null || true
          docker run -d --name dorks-and-dice-rules-core-smoketest \
            --network dorks-and-dice-rules-core-test \
            -e RulesCore__BootstrapBaseline=false \
            -e ConnectionStrings__RulesCore='Host=dorks-and-dice-rules-core-test-postgres;Port=5432;Database=rules_core_test;Username=rules_core_test;Password=rules_core_test' \
            dorks-and-dice-rules-core:latest

          ready=false
          for i in {1..20}; do
            if [ "$(docker inspect -f '{{.State.Running}}' dorks-and-dice-rules-core-smoketest 2>/dev/null)" != "true" ]; then
              echo "Rules Core smoke-test container exited before becoming ready."
              docker logs dorks-and-dice-rules-core-smoketest || true
              exit 1
            fi

            health=$(docker run --rm \
              --network dorks-and-dice-rules-core-test \
              curlimages/curl:8.12.1 \
              -fsS http://dorks-and-dice-rules-core-smoketest:8080/health 2>/dev/null || true)
            readiness=$(docker run --rm \
              --network dorks-and-dice-rules-core-test \
              curlimages/curl:8.12.1 \
              -fsS http://dorks-and-dice-rules-core-smoketest:8080/ready 2>/dev/null || true)

            if [ "$health" = "Healthy" ] && echo "$readiness" | grep -q '"status":"ready"'; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            echo "Rules Core smoke test failed."
            docker logs dorks-and-dice-rules-core-smoketest || true
            exit 1
          fi

      - name: Cleanup smoke-test infrastructure
        if: always()
        timeout-minutes: 3
        run: |
          docker rm -f dorks-and-dice-rules-core-smoketest 2>/dev/null || true
          docker rm -f dorks-and-dice-rules-core-test-postgres 2>/dev/null || true
          docker network rm dorks-and-dice-rules-core-test 2>/dev/null || true

      - name: Deploy
        timeout-minutes: 5
        run: |
          ENV_FILE=/mnt/HDDs/www/dorks-and-dice-rules-core/.env
          if [ ! -f "$ENV_FILE" ]; then
            echo "Rules Core deployment configuration is missing: $ENV_FILE"
            exit 1
          fi

          for required_key in RulesCorePrivate__Network RulesCorePrivate__DatabaseNetwork; do
            if ! grep -q "^${required_key}=" "$ENV_FILE"; then
              echo "Rules Core private deployment configuration is missing: ${required_key}"
              exit 1
            fi
          done

          docker compose \
            --project-name dorks-and-dice-rules-core \
            --env-file "$ENV_FILE" \
            -f docker-compose.yml \
            -f docker-compose.private-tunnel.yml \
            config >/dev/null

          docker compose \
            --project-name dorks-and-dice-rules-core \
            --env-file "$ENV_FILE" \
            -f docker-compose.yml \
            -f docker-compose.private-tunnel.yml \
            up -d --force-recreate --remove-orphans

      - name: Verify deployed services
        timeout-minutes: 32
        run: |
          ENV_FILE=/mnt/HDDs/www/dorks-and-dice-rules-core/.env
          PRIVATE_NETWORK=$(grep '^RulesCorePrivate__Network=' "$ENV_FILE" | tail -n 1 | cut -d= -f2-)
          if [ -z "$PRIVATE_NETWORK" ]; then
            echo "RulesCorePrivate__Network is missing."
            exit 1
          fi

          deadline=$((SECONDS + 1800))
          initial_restarts=$(docker inspect -f '{{.RestartCount}}' dorks-and-dice-rules-core 2>/dev/null || echo 0)
          initial_private_restarts=$(docker inspect -f '{{.RestartCount}}' dorks-and-dice-rules-core-private 2>/dev/null || echo 0)
          attempt=0
          public_ready=false
          private_ready=false

          while [ "$SECONDS" -lt "$deadline" ]; do
            attempt=$((attempt + 1))

            for container in dorks-and-dice-rules-core dorks-and-dice-rules-core-private; do
              if ! docker inspect "$container" >/dev/null 2>&1; then
                echo "Deployed Rules Core container is missing: $container"
                exit 1
              fi
              state=$(docker inspect -f '{{.State.Status}}' "$container" 2>/dev/null || echo unknown)
              if [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
                echo "$container entered state '$state'."
                docker logs --tail 200 "$container" || true
                exit 1
              fi
            done

            restarts=$(docker inspect -f '{{.RestartCount}}' dorks-and-dice-rules-core 2>/dev/null || echo 0)
            private_restarts=$(docker inspect -f '{{.RestartCount}}' dorks-and-dice-rules-core-private 2>/dev/null || echo 0)
            if [ "$restarts" -ge $((initial_restarts + 3)) ]; then
              echo "Public Rules Core is crash-looping (restart count $restarts)."
              docker logs --tail 200 dorks-and-dice-rules-core || true
              exit 1
            fi
            if [ "$private_restarts" -ge $((initial_private_restarts + 3)) ]; then
              echo "Private Rules Core is crash-looping (restart count $private_restarts)."
              docker logs --tail 200 dorks-and-dice-rules-core-private || true
              exit 1
            fi

            public_response=$(timeout 8s docker run --rm \
              --network dorks-and-dice-backend \
              curlimages/curl:8.12.1 \
              --connect-timeout 2 \
              --max-time 5 \
              -fsS http://dorks-and-dice-rules-core:8080/ready 2>/dev/null || true)
            if echo "$public_response" | grep -q '"status":"ready"'; then
              public_ready=true
            fi

            private_response=$(timeout 8s docker run --rm \
              --network "$PRIVATE_NETWORK" \
              curlimages/curl:8.12.1 \
              --connect-timeout 2 \
              --max-time 5 \
              -fsS http://dorks-and-dice-rules-core-private:8080/ready 2>/dev/null || true)
            if echo "$private_response" | grep -q '"status":"ready"'; then
              private_ready=true
            fi

            if [ "$public_ready" = "true" ] && [ "$private_ready" = "true" ]; then
              echo "$public_response"
              echo "$private_response"
              exit 0
            fi

            if [ $((attempt % 30)) -eq 0 ]; then
              echo "Rules Core is still starting; public_ready=$public_ready private_ready=$private_ready public_restarts=$restarts private_restarts=$private_restarts."
              docker logs --tail 40 dorks-and-dice-rules-core || true
              docker logs --tail 40 dorks-and-dice-rules-core-private || true
            fi

            sleep 1
          done

          echo "Rules Core public/private deployment did not become ready within 30 minutes."
          docker logs --tail 200 dorks-and-dice-rules-core || true
          docker logs --tail 200 dorks-and-dice-rules-core-private || true
          exit 1
