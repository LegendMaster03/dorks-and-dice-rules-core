# Deployment remains disabled while Rules Core has no executable runtime.
# Restore deployment and smoke tests only after the new implementation is
# approved, keeping main-only deploy policy and public/private isolation.
name: Rules Core Deployment Disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  not-deployable:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Rules Core rewrite has no deployable runtime."
