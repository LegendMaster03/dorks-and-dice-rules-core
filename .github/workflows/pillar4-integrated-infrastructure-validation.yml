name: Pillar 4 integrated Rules Core regression
on:
  push:
    branches:
      - integration/pillar4-infrastructure-remediation-20261119
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore and build
        run: |
          dotnet restore RulesCore.slnx
          dotnet build RulesCore.slnx -c Release --no-restore
      - name: Full .NET regression suite
        run: dotnet test RulesCore.slnx -c Release --no-build
      - name: Native structural checks
        run: |
          python3 tools/validate_ruleset_split.py
          python3 tools/audit_native_baseline.py --native data/rulesets/first-party-001/native --strict
      - name: Python regression suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
