# Rules Core rewrite: private ingress topology placeholder only.
# A reviewed future runtime must keep private authoring traffic separated from
# ordinary Tool consumers and preserve Site-issued Tool-to-Tool delegation.
# No private service is launched by this file.
services: {}

networks:
  rules-core-private-tunnel:
    external: true
    name: "${RulesCorePrivate__Network:-rules-core-private-tunnel}"
  dorks-and-dice-tool-control-plane:
    external: true
    name: "${ToolHosting__ControlPlaneNetwork:-dorks-and-dice-tool-control-plane}"
  rules-core-database:
    external: true
    name: "${RulesCorePrivate__DatabaseNetwork:-dorks-and-dice-rules-core-db}"
