# Phase 3A isolated private ingress, started only through an approved deployment.
# It must not join dorks-and-dice-backend or a shared database network.
services:
  rules-core-private:
    image: dorks-and-dice-rules-core:phase3a
    build: .
    container_name: dorks-and-dice-rules-core-private
    restart: unless-stopped
    environment:
      RulesCore__ApiSurface: PrivateOnly
      Rulesets__ContentRoot: /app/data/rulesets
      ToolHost__BaseUrl: ${TOOL_HOST_BASE_URL:-http://dorks-and-dice-site:8080}
    networks:
      - rules-core-private-tunnel
      - dorks-and-dice-tool-control-plane

networks:
  rules-core-private-tunnel:
    external: true
    name: "${RulesCorePrivate__Network:?RulesCorePrivate__Network must be set}"
  dorks-and-dice-tool-control-plane:
    external: true
    name: "${ToolHosting__ControlPlaneNetwork:-dorks-and-dice-tool-control-plane}"
